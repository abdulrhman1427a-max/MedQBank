name: Fix iPad IndexedDB Migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-ipad-indexeddb.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair IndexedDB migration and storage handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('courses.html')
          s=p.read_text(encoding='utf-8')
          old="""const DB_NAME='NoviStudyFiles',DB_VERSION=2,STORE='files';
function db(){return new Promise((ok,no)=>{if(!('indexedDB' in window))return no(new Error('IndexedDB غير مدعوم'));let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error||new Error('تعذر فتح قاعدة الملفات'));r.onblocked=()=>no(new Error('قاعدة الملفات مستخدمة في تبويب آخر'))})}
async function putBlob(id,b){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(b,id);t.oncomplete=()=>{d.close();ok()};t.onerror=()=>{let e=t.error;d.close();no(e)};t.onabort=()=>{let e=t.error;d.close();no(e)}})}
async function getBlob(id){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(id);r.onsuccess=()=>{let v=r.result;d.close();ok(v)};r.onerror=()=>{let e=r.error;d.close();no(e)}})}
async function addFiles(list,c){if(!c||!list||!list.length)return;let added=0;try{c.items=c.items||[];for(const f of list){if(!f||!f.name)continue;let id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2);await putBlob(id,f);c.items.push({fileId:id,fileName:f.name,fileType:f.type||'application/octet-stream',fileSize:f.size||0,status:'incomplete'});added++}save();if(current&&current.id===c.id)renderFiles();render();if(added)toastMessage('تمت إضافة '+added+' ملف بنجاح')}catch(err){console.error('File upload failed',err);alert('تعذر إضافة الملف. تأكد أن التصفح الخاص غير مفعّل وأن هناك مساحة تخزين كافية، ثم حاول مرة أخرى.')}}"""
          new="""const DB_NAME='NoviStudyFiles',STORE='files';
let dbPromise=null;
function db(){if(dbPromise)return dbPromise;dbPromise=new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('IndexedDB unavailable'));let r=indexedDB.open(DB_NAME);r.onsuccess=()=>{let d=r.result;if(d.objectStoreNames.contains(STORE)){d.onversionchange=()=>d.close();return ok(d)}let next=d.version+1;d.close();let u=indexedDB.open(DB_NAME,next);u.onupgradeneeded=()=>{if(!u.result.objectStoreNames.contains(STORE))u.result.createObjectStore(STORE)};u.onsuccess=()=>{u.result.onversionchange=()=>u.result.close();ok(u.result)};u.onerror=()=>no(u.error)};r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('IndexedDB blocked'))}).catch(e=>{dbPromise=null;throw e});return dbPromise}
async function putBlob(id,b){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');let r=t.objectStore(STORE).put(b,id);r.onerror=()=>no(r.error);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Storage transaction aborted'))})}
async function getBlob(id){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE,'readonly').objectStore(STORE).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function addFiles(list,c){if(!c||!list||!list.length)return;let added=0;try{c.items=c.items||[];for(const f of list){if(!f||!f.name)continue;let id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2);await putBlob(id,f);c.items.push({fileId:id,fileName:f.name,fileType:f.type||'application/octet-stream',fileSize:f.size||0,status:'incomplete'});added++}save();if(current&&current.id===c.id)renderFiles();render();if(added)toastMessage('تمت إضافة '+added+' ملف بنجاح')}catch(err){console.error('File upload failed',err);dbPromise=null;let detail=(err&&err.name)?' ('+err.name+')':'';alert('تعذر حفظ الملف على الجهاز'+detail+'. أغلق أي تبويب قديم للموقع ثم أعد تحميل الصفحة وحاول مرة أخرى.')}}"""
          if old not in s: raise SystemExit('storage block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses.html
          git commit -m 'Fix IndexedDB storage on iPad Safari'
          git push