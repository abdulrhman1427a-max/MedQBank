name: Link Courses Navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/link-courses.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only Courses navigation item
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="navitem">▤ مقرراتي الدراسية</div>'
          new='<div class="navitem" id="coursesBtn">▤ مقرراتي الدراسية</div>'
          if old not in s:
              raise SystemExit('Expected Courses nav item not found; refusing to alter index.html')
          s=s.replace(old,new,1)
          marker="$('settingsBtn').onclick=()=>{close();setP(profile);modal.classList.add('open')};"
          addition=marker+"$('coursesBtn').onclick=()=>{location.href='courses.html'};"
          if marker not in s:
              raise SystemExit('Expected settings handler not found; refusing to alter index.html')
          s=s.replace(marker,addition,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify only intended wiring exists
        run: |
          grep -q 'id="coursesBtn"' index.html
          grep -q "location.href='courses.html'" index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Link Courses navigation to courses page'
          git push
