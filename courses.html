<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقرراتي | NoviStudy</title><style>:root{--n:#06496f;--i:#143c5d;--m:#7890a4;--l:#dbe6ee;--bg:#f4f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}.bar{height:78px;background:linear-gradient(90deg,#064667,#0b8bbd);display:flex;align-items:center;justify-content:space-between;padding:0 4%;color:#fff}.brand{font-size:28px;font-weight:900}.wrap{max-width:1480px;margin:auto;padding:20px}.hero{background:linear-gradient(120deg,#064669,#13a5dd);border-radius:28px;color:#fff;padding:30px 36px;display:flex;justify-content:space-between;gap:20px}.summary{display:flex;gap:10px}.sum{background:#ffffff16;border-radius:17px;padding:13px 18px;text-align:center}.sum b{display:block;font-size:25px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.primary,.open{border:0;background:var(--n);color:#fff;border-radius:13px;padding:13px 19px;font-weight:900}.pill,.addfile,.menu,.file button,.file select{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px;font-weight:800}.pill.on{background:#e8f5ff;color:#087bb5}.search{flex:1;min-width:250px;border:1px solid var(--l);border-radius:13px;padding:0 15px}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.course,.panel{background:#fff;border:1px solid var(--l);border-radius:24px;padding:22px}.head,.file{display:flex;align-items:center;gap:12px}.icon{width:60px;height:60px;border-radius:17px;background:#e5f4ff;display:grid;place-items:center;font-size:29px}.title,.fileInfo{flex:1;min-width:0}.title h2{margin:0}.meta,.small{color:var(--m);font-size:13px}.info{margin:17px 0;color:#6d879a}.track{height:10px;background:#e5edf3;border-radius:10px;overflow:hidden}.fill{height:100%;background:#18a4e4}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.state{text-align:center;padding:9px;border-radius:12px}.done{background:#effbf5;color:#16865c}.review{background:#fff9e9;color:#a86d00}.inc{background:#fff2f3;color:#cf4650}.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin-top:14px}.detail{display:none}.detail.on{display:block}.main.hide{display:none}.detailHero{background:linear-gradient(120deg,#064669,#13a5dd);color:#fff;border-radius:25px;padding:24px;display:flex;justify-content:space-between}.file{padding:14px 2px;border-bottom:1px solid #edf2f5}.del{color:#c43d47!important}.modal{display:none;position:fixed;inset:0;background:#00182e95;place-items:center;z-index:50}.modal.on{display:grid}.box{width:min(540px,94%);background:#fff;border-radius:24px;padding:24px}.box input{width:100%;height:45px;margin:5px 0 10px;border:1px solid var(--l);border-radius:11px;padding:10px}.empty{text-align:center;padding:45px;color:var(--m)}@media(max-width:800px){.courses{grid-template-columns:1fr}.hero{display:block}.summary{margin-top:18px}.file{flex-wrap:wrap}}</style></head><body><header class="bar"><div class="brand">⚛️ NoviStudy</div><button class="pill" onclick="location.href='index.html'">← لوحة التحكم</button></header><main class="wrap"><div id="main" class="main"><section class="hero"><div><h1>📚 مقرراتي الدراسية</h1><p>مقرراتك وملفاتك وتقدمك الأكاديمي في مكان واحد.</p></div><div class="summary"><div class="sum"><b id="ct">0</b>المقررات</div><div class="sum"><b id="ft">0</b>الملفات</div><div class="sum"><b id="pt">0%</b>الإنجاز</div></div></section><div class="tools"><button class="primary" id="addCourse">＋ إضافة مقرر</button><button class="pill on" data-f="all">الكل</button><button class="pill" data-f="active">قيد الدراسة</button><button class="pill" data-f="done">مكتمل</button><input id="search" class="search" placeholder="🔎 ابحث..."></div><section id="courses" class="courses"></section></div><section id="detail" class="detail"><div class="detailHero"><div><h1 id="dname"></h1><div id="dmeta"></div></div><button class="pill" onclick="closeCourse()">← رجوع</button></div><div class="panel"><h2>📁 ملفات المقرر</h2><input id="picker" type="file" multiple hidden><label class="primary" for="picker">＋ اختيار ملف من الجهاز</label><div id="files"></div></div></section></main><input id="quick" type="file" multiple hidden><div class="modal" id="courseModal"><div class="box"><h2 id="modalTitle">إضافة مقرر</h2><label>اسم المقرر</label><input id="mn"><label>رمز المقرر</label><input id="mc"><label>عدد الوحدات</label><input id="mu" type="number" value="3"><label>الأيقونة</label><input id="mi" placeholder="🫀"><div class="actions"><button class="primary" id="modalSave">حفظ</button><button class="pill" onclick="closeModal()">إلغاء</button><button class="pill del" id="deleteCourse">حذف</button></div></div></div><script>const $=x=>document.getElementById(x),KEY='novi_courses';let courses=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,editing=null,filter='all',quickId=null;function save(){localStorage.setItem(KEY,JSON.stringify(courses))}function st(x){return x.status||(x.done?'done':'incomplete')}function calc(c){c.items=c.items||[];let d=c.items.filter(x=>st(x)==='done').length;c.progress=c.items.length?Math.round(d/c.items.length*100):0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){courses.forEach(calc);let q=$('search').value.toLowerCase(),list=courses.filter(c=>(c.name+' '+(c.code||'')).toLowerCase().includes(q)&&(filter==='all'||filter==='done'&&c.progress===100||filter==='active'&&c.progress<100));$('courses').innerHTML=list.length?list.map(c=>{let d=c.items.filter(x=>st(x)==='done').length,r=c.items.filter(x=>st(x)==='review').length,i=c.items.length-d-r;return `<article class="course"><div class="head"><div class="icon">${esc(c.icon||'📘')}</div><div class="title"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.code||'بدون رمز')}</div></div><button class="menu" onclick="editCourse('${c.id}')">•••</button></div><div class="info">${c.credits||0} وحدات · ${c.items.length} ملف</div><div class="track"><div class="fill" style="width:${c.progress}%"></div></div><b>${c.progress}%</b><div class="states"><div class="state done">${d} مكتملة</div><div class="state review">${r} مراجعة</div><div class="state inc">${i} لم تكتمل</div></div><div class="actions"><button class="open" onclick="openCourse('${c.id}')">فتح المقرر ←</button><label class="addfile" for="quick" onclick="quickId='${c.id}'">＋ إضافة ملف</label></div></article>`}).join(''):'<div class="empty">لا توجد مقررات</div>';let a=courses.flatMap(c=>c.items||[]),d=a.filter(x=>st(x)==='done').length;$('ct').textContent=courses.length;$('ft').textContent=a.length;$('pt').textContent=(a.length?Math.round(d/a.length*100):0)+'%';save()}function openCourse(id){current=courses.find(c=>c.id===id);$('main').classList.add('hide');$('detail').classList.add('on');$('dname').textContent=(current.icon||'📘')+' '+current.name;$('dmeta').textContent=(current.code||'بدون رمز')+' · '+(current.credits||0)+' وحدات';renderFiles()}function closeCourse(){$('detail').classList.remove('on');$('main').classList.remove('hide');render()}function renderFiles(){$('files').innerHTML=current.items.length?current.items.map((x,i)=>`<div class="file"><div>📄</div><div class="fileInfo"><b>${esc(x.fileName||x.name)}</b><div class="small">${esc(x.fileType||'ملف')}</div></div><button onclick="openEditor('${esc(x.fileId||'')}','${encodeURIComponent(x.fileName||x.name)}')">✏️ فتح وتحرير</button><select onchange="setStatus(${i},this.value)"><option value="incomplete" ${st(x)==='incomplete'?'selected':''}>⏱ لم يكتمل</option><option value="done" ${st(x)==='done'?'selected':''}>✅ تم الإنجاز</option><option value="review" ${st(x)==='review'?'selected':''}>🕘 مراجعة</option></select><button class="del" onclick="deleteFile(${i})">🗑 حذف</button></div>`).join(''):'<div class="empty">لا توجد ملفات بعد.</div>';save()}function openEditor(id,name){if(!id)return alert('أعد إضافة هذا الملف من جهازك مرة واحدة.');location.href='file-editor.html?id='+encodeURIComponent(id)+'&name='+name}function setStatus(i,s){current.items[i].status=s;current.items[i].done=s==='done';save();renderFiles()}async function deleteFile(i){let x=current.items[i];if(!confirm('حذف الملف؟'))return;if(x.fileId)await dbDelete(x.fileId);current.items.splice(i,1);save();renderFiles()}function openModal(c){editing=c;$('modalTitle').textContent=c?'تخصيص المقرر':'إضافة مقرر';$('mn').value=c?c.name:'';$('mc').value=c?c.code||'':'';$('mu').value=c?c.credits||0:3;$('mi').value=c?c.icon||'':'';$('deleteCourse').style.display=c?'block':'none';$('courseModal').classList.add('on')}function closeModal(){$('courseModal').classList.remove('on')}function editCourse(id){openModal(courses.find(c=>c.id===id))}$('addCourse').onclick=()=>openModal(null);$('modalSave').onclick=()=>{let n=$('mn').value.trim();if(!n)return;if(editing){editing.name=n;editing.code=$('mc').value;editing.credits=+$('mu').value;editing.icon=$('mi').value}else courses.push({id:Date.now()+'',name:n,code:$('mc').value,credits:+$('mu').value,icon:$('mi').value,items:[]});save();closeModal();render()};$('deleteCourse').onclick=()=>{if(editing&&confirm('حذف المقرر؟')){courses=courses.filter(c=>c.id!==editing.id);save();closeModal();render()}};$('search').oninput=render;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});$('picker').onchange=async e=>{await addFiles(current,e.target.files);e.target.value=''};$('quick').onchange=async e=>{let c=courses.find(x=>x.id===quickId);if(c)await addFiles(c,e.target.files);e.target.value='';render()};async function addFiles(c,fs){for(const f of fs){let id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2);await dbPut(id,f);c.items.push({name:f.name,fileName:f.name,fileType:f.type,fileSize:f.size,fileId:id,status:'incomplete'})}save();if(current===c)renderFiles()}function db(){return new Promise((ok,no)=>{let r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(id,blob){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').put({id,blob,name:blob.name,type:blob.type});t.oncomplete=ok})}async function dbDelete(id){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=ok})}render();</script></body></html>
