<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقرراتي | NoviStudy</title><style>:root{--n:#06496f;--i:#143c5d;--m:#7890a4;--l:#dbe6ee;--bg:#f4f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}.bar{height:78px;background:linear-gradient(90deg,#064667,#0b8bbd);display:flex;align-items:center;justify-content:space-between;padding:0 4%;color:#fff}.brand{font-size:28px;font-weight:900;display:flex;gap:10px;align-items:center}.brand img{width:43px}.back,.ghost{border:1px solid #ffffff55;background:#ffffff0c;color:#fff;border-radius:13px;padding:11px 17px;font-weight:800}.wrap{max-width:1480px;margin:auto;padding:20px}.hero{background:linear-gradient(120deg,#064669,#0a77aa,#13a5dd);border-radius:28px;color:#fff;padding:30px 36px;display:flex;justify-content:space-between;align-items:center;gap:25px}.hero h1{font-size:36px;margin:0 0 9px}.hero p{margin:0;color:#d8eff9}.summary{display:flex;gap:10px}.sum{background:#ffffff16;border:1px solid #ffffff18;border-radius:17px;padding:13px 18px;text-align:center;min-width:110px}.sum b{display:block;font-size:25px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.primary{border:0;background:var(--n);color:#fff;border-radius:13px;padding:13px 19px;font-weight:900}.search{flex:1;min-width:250px;height:46px;border:1px solid var(--l);background:#fff;border-radius:13px;padding:0 15px}.pill{border:1px solid var(--l);background:#fff;border-radius:999px;padding:11px 16px;font-weight:800}.pill.on{background:#e8f5ff;border-color:#9dd4f1;color:#087bb5}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.course{background:#fff;border:1px solid var(--l);border-radius:25px;padding:22px;box-shadow:0 7px 22px #173b570d}.head{display:flex;align-items:center;gap:14px}.icon{width:62px;height:62px;border-radius:18px;background:#e5f4ff;display:grid;place-items:center;font-size:30px}.title{flex:1;min-width:0}.title h2{margin:0;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--m);margin-top:5px}.menu{width:44px;height:44px;border:1px solid var(--l);background:#fff;border-radius:13px;font-size:20px}.info{display:flex;gap:22px;color:#6d879a;margin:19px 0 12px}.track{height:10px;background:#e5edf3;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#1395dc,#20b1ee)}.pct{font-weight:900;font-size:19px;margin:8px 0 13px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.state{border:1px solid;border-radius:14px;padding:10px;text-align:center}.state b{display:block;font-size:21px}.done{background:#effbf5;border-color:#d2f0e1;color:#16865c}.review{background:#fff9e9;border-color:#f2e2b3;color:#b47400}.inc{background:#fff2f3;border-color:#f1d5d8;color:#cf4650}.actions{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:15px}.actions>*{height:46px;border-radius:13px;font-weight:900;display:grid;place-items:center}.open{border:0;background:var(--n);color:#fff}.addfile{border:1px solid var(--l);background:#fff;color:var(--i);white-space:nowrap;cursor:pointer}.empty{grid-column:1/-1;background:#fff;border:1px dashed #bcd0de;border-radius:23px;padding:50px;text-align:center;color:var(--m)}.detail{display:none}.detail.on{display:block}.main.hide{display:none}.detailHero{background:linear-gradient(120deg,#064669,#13a5dd);border-radius:25px;padding:25px;color:#fff;display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid var(--l);border-radius:23px;padding:22px;margin-top:17px}.file{display:flex;align-items:center;gap:12px;border-bottom:1px solid #edf2f5;padding:14px 4px}.fileInfo{flex:1;min-width:0}.fileInfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:12px;color:var(--m);margin-top:4px}.file button,.file select{height:40px;border-radius:11px;border:1px solid var(--l);background:#fff;padding:0 11px}.view{color:#087db9;font-weight:800}.del{color:#c43d47!important;background:#fff5f5!important}.modal{display:none;position:fixed;inset:0;background:#00182e95;z-index:50;place-items:center;padding:18px}.modal.on{display:grid}.box{background:#fff;width:min(560px,100%);border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-weight:800;display:block;margin-bottom:5px}.field input{width:100%;height:46px;border:1px solid var(--l);border-radius:12px;padding:0 11px}.modalBtns{display:flex;gap:9px;margin-top:17px}.modalBtns button{flex:1;height:45px;border-radius:12px;font-weight:900}.save{border:0;background:#087fbc;color:#fff}.cancel{border:1px solid var(--l);background:#fff}.danger{border:1px solid #f0c8cc;background:#fff1f2;color:#c63e48}@media(max-width:800px){.courses{grid-template-columns:1fr}.hero{display:block}.summary{margin-top:20px;overflow:auto}.grid{grid-template-columns:1fr}.file{flex-wrap:wrap}.fileInfo{flex-basis:60%}}@media(max-width:520px){.wrap{padding:12px}.hero{padding:23px 18px}.hero h1{font-size:28px}.states{gap:5px}.state{padding:8px 3px;font-size:12px}.actions{grid-template-columns:1fr 1fr}}</style></head><body><header class="bar"><div class="brand"><img src="novistudy-logo.svg">NoviStudy</div><button class="back" onclick="location.href='index.html'">← لوحة التحكم</button></header><main class="wrap"><div id="main" class="main"><section class="hero"><div><h1>📚 مقرراتي الدراسية</h1><p>مقرراتك وملفاتك وتقدمك الأكاديمي في مكان واحد.</p></div><div class="summary"><div class="sum"><b id="ct">0</b>المقررات</div><div class="sum"><b id="ft">0</b>الملفات</div><div class="sum"><b id="pt">0%</b>الإنجاز</div></div></section><div class="tools"><button class="primary" id="addCourse">＋ إضافة مقرر</button><button class="pill on" data-f="all">الكل</button><button class="pill" data-f="active">قيد الدراسة</button><button class="pill" data-f="done">مكتمل</button><button class="pill" data-f="review">يحتاج مراجعة</button><input id="search" class="search" placeholder="🔎 ابحث باسم المقرر أو الرمز..."></div><section id="courses" class="courses"></section></div><section id="detail" class="detail"><div class="detailHero"><div><h1 id="dname"></h1><div id="dmeta"></div></div><button class="ghost" onclick="closeCourse()">← رجوع</button></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">📁 ملفات المقرر</h2><p style="color:#71899b">اضغط «فتح» لعرض الملف الذي أضفته من جهازك.</p></div><input id="picker" type="file" multiple hidden><label class="primary" for="picker">＋ اختيار ملف من الجهاز</label></div><div id="files"></div></div></section></main><input id="quick" type="file" multiple hidden><div class="modal" id="courseModal"><div class="box"><h2 id="modalTitle">إضافة مقرر</h2><div class="grid"><div class="field"><label>اسم المقرر</label><input id="mn"></div><div class="field"><label>رمز المقرر</label><input id="mc"></div><div class="field"><label>عدد الوحدات</label><input id="mu" type="number" min="0" value="3"></div><div class="field"><label>أيقونة المقرر</label><input id="mi" placeholder="مثال: 🫀"></div></div><div class="modalBtns"><button class="save" id="modalSave">حفظ</button><button class="cancel" onclick="closeModal()">إلغاء</button><button class="danger" id="deleteCourse" style="display:none">حذف المقرر</button></div></div></div><script>const $=id=>document.getElementById(id),KEY='novi_courses';let courses=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,filter='all',editing=null,quickId=null;const icons=['📘','🫀','🧪','🔬','💊','🧬'];function save(){localStorage.setItem(KEY,JSON.stringify(courses))}function st(x){return x.status||(x.done?'done':'incomplete')}function calc(c){c.items=c.items||[];let d=c.items.filter(x=>st(x)==='done').length;c.progress=c.items.length?Math.round(d/c.items.length*100):0;return c}function totals(){let a=courses.flatMap(c=>c.items||[]),d=a.filter(x=>st(x)==='done').length;return{files:a.length,p:a.length?Math.round(d/a.length*100):0}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){courses.forEach(calc);let q=$('search').value.toLowerCase();let list=courses.filter(c=>{let rev=c.items.some(x=>st(x)==='review');return(c.name+' '+(c.code||'')).toLowerCase().includes(q)&&(filter==='all'||filter==='done'&&c.progress===100||filter==='active'&&c.progress<100||filter==='review'&&rev)});$('courses').innerHTML=list.length?list.map((c,k)=>{let d=c.items.filter(x=>st(x)==='done').length,r=c.items.filter(x=>st(x)==='review').length,i=c.items.length-d-r;return `<article class="course"><div class="head"><div class="icon">${esc(c.icon||icons[k%icons.length])}</div><div class="title"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.code||'بدون رمز')}</div></div><button class="menu" onclick="editCourse('${c.id}')">•••</button></div><div class="info"><span>▱ ${Number(c.credits||0)} وحدات</span><span>▤ ${c.items.length} ملف</span></div><div class="track"><div class="fill" style="width:${c.progress}%"></div></div><div class="pct">${c.progress}%</div><div class="states"><div class="state done"><b>${d}</b>مكتملة</div><div class="state review"><b>${r}</b>تحتاج مراجعة</div><div class="state inc"><b>${i}</b>لم تكتمل</div></div><div class="actions"><button class="open" onclick="openCourse('${c.id}')">فتح المقرر ←</button><label class="addfile" for="quick" onclick="quickId='${c.id}'">＋ إضافة ملف</label></div></article>`}).join(''):'<div class="empty"><h2>📚 لا توجد مقررات</h2><p>أضف مقرراً جديداً للبدء.</p></div>';let t=totals();$('ct').textContent=courses.length;$('ft').textContent=t.files;$('pt').textContent=t.p+'%';save()}function openCourse(id){current=courses.find(c=>c.id===id);if(!current)return;$('main').classList.add('hide');$('detail').classList.add('on');$('dname').textContent=(current.icon||'📘')+' '+current.name;$('dmeta').textContent=(current.code||'بدون رمز')+' · '+Number(current.credits||0)+' وحدات';renderFiles()}function closeCourse(){$('detail').classList.remove('on');$('main').classList.remove('hide');render()}function renderFiles(){if(!current)return;$('files').innerHTML=current.items.length?current.items.map((x,i)=>`<div class="file"><div style="font-size:26px">📄</div><div class="fileInfo"><b>${esc(x.fileName||x.name)}</b><div class="small">${esc(x.fileType||'ملف')}${x.fileSize?' · '+formatSize(x.fileSize):''}</div></div><button class="view" onclick="openFile('${esc(x.fileId||'')}')">👁 فتح</button><select onchange="setStatus(${i},this.value)"><option value="incomplete" ${st(x)==='incomplete'?'selected':''}>⏱ لم يكتمل</option><option value="done" ${st(x)==='done'?'selected':''}>✅ تم الإنجاز</option><option value="review" ${st(x)==='review'?'selected':''}>🕘 يحتاج مراجعة</option></select><button class="del" onclick="deleteFile(${i})">🗑 حذف</button></div>`).join(''):'<div class="empty" style="margin-top:18px">لا توجد ملفات بعد. اختر ملفاً من جهازك.</div>';save()}function formatSize(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function setStatus(i,s){current.items[i].status=s;current.items[i].done=s==='done';save();renderFiles()}async function deleteFile(i){let x=current.items[i];if(!confirm('حذف الملف «'+(x.fileName||x.name)+'»؟'))return;if(x.fileId)await dbDelete(x.fileId);current.items.splice(i,1);save();renderFiles()}function openModal(edit){editing=edit||null;$('modalTitle').textContent=editing?'تخصيص المقرر':'إضافة مقرر';$('deleteCourse').style.display=editing?'block':'none';$('mn').value=editing?editing.name:'';$('mc').value=editing?(editing.code||''):'';$('mu').value=editing?Number(editing.credits||0):3;$('mi').value=editing?(editing.icon||''):'';$('courseModal').classList.add('on')}function closeModal(){$('courseModal').classList.remove('on');editing=null}$('addCourse').onclick=()=>openModal(null);function editCourse(id){openModal(courses.find(c=>c.id===id))}$('modalSave').onclick=()=>{let n=$('mn').value.trim();if(!n)return alert('اكتب اسم المقرر');if(editing){editing.name=n;editing.code=$('mc').value.trim();editing.credits=Number($('mu').value||0);editing.icon=$('mi').value.trim()}else courses.push({id:Date.now().toString(),name:n,code:$('mc').value.trim(),credits:Number($('mu').value||0),icon:$('mi').value.trim(),items:[]});save();closeModal();render()};$('deleteCourse').onclick=async()=>{if(!editing||!confirm('هل تريد حذف مقرر «'+editing.name+'» وجميع ملفاته؟'))return;for(const x of editing.items||[])if(x.fileId)await dbDelete(x.fileId);courses=courses.filter(c=>c.id!==editing.id);save();closeModal();render()};$('search').oninput=render;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});$('picker').onchange=async e=>{await addFiles(current,e.target.files);e.target.value=''};$('quick').onchange=async e=>{let c=courses.find(x=>x.id===quickId);if(c)await addFiles(c,e.target.files);e.target.value='';render()};async function addFiles(c,files){if(!c||!files.length)return;for(const f of Array.from(files)){let id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2);try{await dbPut(id,f);c.items.push({name:f.name,fileName:f.name,fileType:f.type||'ملف',fileSize:f.size,fileId:id,status:'incomplete',done:false})}catch(e){alert('تعذر حفظ الملف '+f.name)}}save();if(current&&current.id===c.id)renderFiles();render()}function db(){return new Promise((ok,no)=>{let r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(id,blob){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('files','readwrite');t.objectStore('files').put({id,blob,name:blob.name,type:blob.type});t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function dbGet(id){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbDelete(id){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=ok;t.onerror=ok})}async function openFile(id){if(!id)return alert('هذا ملف قديم أضيف قبل ميزة فتح الملفات. أعد إضافته من جهازك مرة واحدة.');try{let rec=await dbGet(id);if(!rec||!rec.blob)return alert('لم يعد الملف محفوظاً على هذا الجهاز.');let u=URL.createObjectURL(rec.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){alert('تعذر فتح الملف.')}}render();</script></body></html>
