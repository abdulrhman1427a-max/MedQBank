<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NoviStudy | مقرراتي</title><style>
:root{--navy:#073f62;--blue:#159bd1;--ink:#163a55;--muted:#7b91a4;--line:#dce6ee;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}.screen{display:none}.screen.on{display:block}.top{height:74px;background:linear-gradient(90deg,#06476c,#119bd0);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-size:27px;font-weight:900}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.wrap{max-width:1450px;margin:auto;padding:24px}.hero{background:linear-gradient(120deg,#06486c,#14a3d9);border-radius:28px;color:#fff;padding:28px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{margin:0 0 8px}.summary{display:flex;gap:10px}.stat{background:#ffffff1c;border:1px solid #ffffff20;border-radius:16px;padding:12px 18px;text-align:center}.stat b{font-size:25px;display:block}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.search{flex:1;min-width:240px;border:1px solid var(--line);border-radius:14px;padding:0 16px;background:#fff}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 5px 20px #143c5d08}.head{display:flex;align-items:center;gap:13px}.icon{width:58px;height:58px;border-radius:17px;background:#e7f5ff;display:grid;place-items:center;font-size:29px}.grow{flex:1;min-width:0}.grow h2{margin:0}.muted{color:var(--muted);font-size:13px}.track{height:9px;background:#e8eff4;border-radius:20px;overflow:hidden;margin:17px 0 7px}.fill{height:100%;background:linear-gradient(90deg,#168fca,#22b4eb)}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.state{border-radius:12px;text-align:center;padding:9px}.done{background:#eaf9f2;color:#16805b}.review{background:#fff8e5;color:#a56b00}.inc{background:#fff0f1;color:#c84650}.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:9px}.detailHero{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}.file{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf2f6}.file:last-child{border-bottom:0}.file select{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.danger{color:#c43f49}.modal{display:none;position:fixed;inset:0;background:#00182e99;z-index:500;place-items:center}.modal.on{display:grid}.box{width:min(520px,94%);background:#fff;border-radius:24px;padding:24px}.box input{width:100%;height:45px;border:1px solid var(--line);border-radius:11px;padding:10px;margin:5px 0 10px}

dding:9px 15px;font-size:12px;opacity:.9}.rec.live{background:#a62f3a}.empty{text-align:center;color:var(--muted);padding:40px}

</style></head><body><header class="top"><div class="brand">⚛️ NoviStudy</div><button class="btn light" onclick="location.href='index.html'">← لوحة التحكم</button></header><main class="wrap"><section id="courseScreen" class="screen on"><section class="hero"><div><h1>📚 مقرراتي الدراسية</h1><div>نظّم مقرراتك وملفاتك وتقدمك الأكاديمي.</div></div><div class="summary"><div class="stat"><b id="ct">0</b>مقرر</div><div class="stat"><b id="ft">0</b>ملف</div><div class="stat"><b id="pt">0%</b>إنجاز</div></div></section><div class="toolbar"><button class="btn primary" id="addCourse">＋ إضافة مقرر</button><input id="search" class="search" placeholder="🔎 ابحث باسم المقرر..."></div><section id="courses" class="courses"></section></section><section id="detailScreen" class="screen"><div class="detailHero"><div><h1 id="dname"></h1><div id="dmeta" class="muted"></div></div><button class="btn light" onclick="show('courseScreen')">← رجوع</button></div><div class="panel"><h2>📁 ملفات المقرر</h2><input id="picker" type="file" multiple hidden><label class="btn primary" for="picker">＋ اختيار ملف من الجهاز</label><div id="files"></div></div></section></main><input id="quick" type="file" multiple hidden>
<section id="editor" class="screen"><div class="doc"><iframe id="pdf" class="preview" hidden></iframe><img id="img" class="preview" hidden><div id="txt" class="preview" hidden style="padding:40px;overflow:auto;white-space:pre-wrap"></div><canvas id="ink" class="ink"></canvas></div><button class="edge back" onclick="closeEditor()">‹ رجوع</button><button class="edge save" onclick="saveInk(true)">حفظ</button><div class="editorBar"><button class="tool on" data-tool="pen" title="قلم">✒️</button><button class="tool" data-tool="pencil" title="رصاص">✏️</button><button class="tool" data-tool="highlighter" title="تظليل">🖍️</button><button class="tool" data-tool="eraser" title="ممحاة">◇</button><div class="sep"></div><div class="colors"><i class="color on" data-color="#111111" style="background:#111"></i><i class="color" data-color="#1688e5" style="background:#1688e5"></i><i class="color" data-color="#e33f49" style="background:#e33f49"></i><i class="color" data-color="#ffd92f" style="background:#ffd92f"></i><i class="color" data-color="#8b5cf6" style="background:#8b5cf6"></i></div><div class="sep"></div><div class="width"><input id="width" type="range" min="1" max="20" value="4"><span id="widthText">4px</span></div><button class="tool rec" id="rec">🎙️</button><div class="sep"></div><button class="tool" onclick="undoInk()">↶</button><button class="tool" onclick="redoInk()">↷</button><button class="tool" id="more">•••</button></div><div class="settings" id="settings"><label><span>شفافية التظليل</span><b id="opText">35%</b></label><input id="opacity" type="range" min="10" max="80" value="35"><label><span>حجم الممحاة</span><b id="erText">24px</b></label><input id="eraser" type="range" min="8" max="70" value="24"><p style="color:#b8c8d5;font-size:12px">Apple Pencil / Stylus للكتابة. الإصبع للتصفح وتحريك الملف.</p><button class="btn primary" style="width:100%" onclick="settings.classList.remove('on')">تم</button></div><div class="toast" id="toast">✏️ القلم للكتابة • الإصبع للتصفح</div></section>
<div class="modal" id="courseModal"><div class="box"><h2 id="modalTitle">إضافة مقرر</h2><label>اسم المقرر</label><input id="mn"><label>رمز المقرر</label><input id="mc"><label>عدد الوحدات</label><input id="mu" type="number" value="3"><label>الأيقونة</label><input id="mi" placeholder="🫀"><div class="actions"><button class="btn primary" id="modalSave">حفظ</button><button class="btn light" onclick="closeModal()">إلغاء</button></div><button class="btn light danger" id="deleteCourse" style="width:100%;margin-top:9px">حذف المقرر</button></div></div>
<script>
const $=id=>document.getElementById(id),KEY='novi_courses';let courses=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,editing=null,quickId=null;function save(){localStorage.setItem(KEY,JSON.stringify(courses))}function status(x){return x.status||(x.done?'done':'incomplete')}function calc(c){c.items=c.items||[];let d=c.items.filter(x=>status(x)==='done').length;c.progress=c.items.length?Math.round(d/c.items.length*100):0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function show(id){document.querySelectorAll('main .screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');if(id==='courseScreen')render()}function render(){courses.forEach(calc);let q=$('search').value.toLowerCase(),list=courses.filter(c=>(c.name+' '+(c.code||'')).toLowerCase().includes(q));$('courses').innerHTML=list.length?list.map(c=>{let d=c.items.filter(x=>status(x)==='done').length,r=c.items.filter(x=>status(x)==='review').length,i=c.items.length-d-r;return `<article class="card"><div class="head"><div class="icon">${esc(c.icon||'📘')}</div><div class="grow"><h2>${esc(c.name)}</h2><div class="muted">${esc(c.code||'بدون رمز')} · ${c.credits||0} وحدات · ${c.items.length} ملف</div></div><button class="btn light" onclick="editCourse('${c.id}')">•••</button></div><div class="track"><div class="fill" style="width:${c.progress}%"></div></div><b>${c.progress}%</b><div class="states"><div class="state done">${d} مكتملة</div><div class="state review">${r} مراجعة</div><div class="state inc">${i} لم تكتمل</div></div><div class="actions"><button class="btn primary" onclick="openCourse('${c.id}')">فتح المقرر ←</button><label class="btn light" for="quick" onclick="quickId='${c.id}'">＋ إضافة ملف</label></div></article>`}).join(''):'<div class="empty">لا توجد مقررات بعد.</div>';let all=courses.flatMap(c=>c.items||[]),done=all.filter(x=>status(x)==='done').length;$('ct').textContent=courses.length;$('ft').textContent=all.length;$('pt').textContent=(all.length?Math.round(done/all.length*100):0)+'%';save()}function openCourse(id){current=courses.find(c=>c.id===id);$('dname').textContent=(current.icon||'📘')+' '+current.name;$('dmeta').textContent=(current.code||'بدون رمز')+' · '+(current.credits||0)+' وحدات';renderFiles();show('detailScreen')}function renderFiles(){$('files').innerHTML=current.items.length?current.items.map((x,i)=>`<div class="file"><div style="font-size:25px">📄</div><div class="grow"><b>${esc(x.fileName||x.name)}</b><div class="muted">${esc(x.fileType||'ملف')}</div></div><button class="btn light" onclick="openEditor('${esc(x.fileId||'')}','${encodeURIComponent(x.fileName||x.name)}')">✏️ فتح</button><select onchange="setStatus(${i},this.value)"><option value="incomplete" ${status(x)==='incomplete'?'selected':''}>⏱ لم يكتمل</option><option value="done" ${status(x)==='done'?'selected':''}>✅ تم الإنجاز</option><option value="review" ${status(x)==='review'?'selected':''}>🕘 يحتاج مراجعة</option></select><button class="btn light danger" onclick="deleteFile(${i})">🗑</button></div>`).join(''):'<div class="empty">لا توجد ملفات بعد. اختر ملفًا من جهازك.</div>';save()}function setStatus(i,s){current.items[i].status=s;current.items[i].done=s==='done';save();renderFiles()}async function deleteFile(i){let x=current.items[i];if(!confirm('حذف الملف؟'))return;if(x.fileId)await dbDelete(x.fileId);current.items.splice(i,1);save();renderFiles()}function openModal(c){editing=c;$('modalTitle').textContent=c?'تخصيص المقرر':'إضافة مقرر';$('mn').value=c?c.name:'';$('mc').value=c?c.code||'':'';$('mu').value=c?c.credits||0:3;$('mi').value=c?c.icon||'':'';$('deleteCourse').style.display=c?'block':'none';$('courseModal').classList.add('on')}function closeModal(){$('courseModal').classList.remove('on')}function editCourse(id){openModal(courses.find(c=>c.id===id))}$('addCourse').onclick=()=>openModal(null);$('modalSave').onclick=()=>{let n=$('mn').value.trim();if(!n)return alert('اكتب اسم المقرر');if(editing){editing.name=n;editing.code=$('mc').value;editing.credits=+$('mu').value;editing.icon=$('mi').value}else courses.push({id:Date.now()+'',name:n,code:$('mc').value,credits:+$('mu').value,icon:$('mi').value,items:[]});save();closeModal();render()};$('deleteCourse').onclick=()=>{if(editing&&confirm('حذف المقرر وكل بياناته من القائمة؟')){courses=courses.filter(c=>c.id!==editing.id);save();closeModal();render()}};$('search').oninput=render;$('picker').onchange=async e=>{await addFiles(current,e.target.files);e.target.value=''};$('quick').onchange=async e=>{let c=courses.find(x=>x.id===quickId);if(c)await addFiles(c,e.target.files);e.target.value='';render()};async function addFiles(c,fs){for(const f of fs){let id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2);await dbPut(id,f);c.items.push({name:f.name,fileName:f.name,fileType:f.type,fileSize:f.size,fileId:id,status:'incomplete'})}save();if(current===c)renderFiles()}function db(){return new Promise((ok,no)=>{let r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(id,blob){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').put({id,blob,name:blob.name,type:blob.type});t.oncomplete=ok})}async function dbGet(id){let d=await db();return new Promise(ok=>{let r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}async function dbDelete(id){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=ok})}
let editId=null,editName='',tool='pen',color='#111111',lineWidth=4,hiOpacity=.35,eraserSize=24,drawing=false,last=null,undo=[],redo=[],mediaRecorder,chunks=[],objectUrl=null;const canvas=$('ink'),ctx=canvas.getContext('2d');async function openEditor(id,name){if(!id)return alert('أعد إضافة هذا الملف من جهازك.');editId=id;editName=decodeURIComponent(name);$('editor').classList.add('on');document.body.style.overflow='hidden';await showFile();setTimeout(()=>{resizeCanvas();loadInk()},250)}function closeEditor(){saveInk(false);$('editor').classList.remove('on');document.body.style.overflow='';$('pdf').hidden=$('img').hidden=$('txt').hidden=true;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}renderFiles()}async function showFile(){let rec=await dbGet(editId);if(!rec)return alert('لم يتم العثور على الملف على هذا الجهاز.');objectUrl=URL.createObjectURL(rec.blob);let type=rec.type||rec.blob.type||'';$('pdf').hidden=$('img').hidden=$('txt').hidden=true;if(type.includes('pdf')){$('pdf').hidden=false;$('pdf').src='pdf-viewer.html?id='+encodeURIComponent(editId)+'&v=4'}else if(type.startsWith('image/')){$('img').hidden=false;$('img').src=objectUrl}else if(type.startsWith('text/')){$('txt').hidden=false;$('txt').textContent=await rec.blob.text()}else{$('pdf').hidden=false;$('pdf').src=objectUrl}}function resizeCanvas(){let r=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1,old=canvas.width?canvas.toDataURL():null;canvas.width=Math.round(r.width*ratio);canvas.height=Math.round(r.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);if(old){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}addEventListener('resize',()=>{$('editor').classList.contains('on')&&resizeCanvas()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tool=b.dataset.tool});document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{document.querySelectorAll('.color').forEach(y=>y.classList.remove('on'));x.classList.add('on');color=x.dataset.color});$('width').oninput=e=>{lineWidth=+e.target.value;$('widthText').textContent=lineWidth+'px'};$('opacity').oninput=e=>{hiOpacity=+e.target.value/100;$('opText').textContent=e.target.value+'%'};$('eraser').oninput=e=>{eraserSize=+e.target.value;$('erText').textContent=eraserSize+'px'};$('more').onclick=()=>$('settings').classList.toggle('on');function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function isPen(e){return e.pointerType==='pen'}canvas.addEventListener('pointerdown',e=>{if(!isPen(e))return;e.preventDefault();undo.push(canvas.toDataURL());if(undo.length>25)undo.shift();redo=[];drawing=true;last=point(e);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drawing||!isPen(e))return;e.preventDefault();let p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=eraserSize}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='highlighter'?hiOpacity:(tool==='pencil'?.65:1);let pressure=e.pressure>.05?(.7+e.pressure*.6):1;ctx.lineWidth=(tool==='pencil'?Math.max(1,lineWidth*.7):lineWidth)*pressure}ctx.stroke();ctx.globalAlpha=1;last=p});canvas.addEventListener('pointerup',e=>{if(!isPen(e))return;drawing=false;saveInk(false)});canvas.addEventListener('pointercancel',()=>drawing=false);document.addEventListener('pointerdown',e=>{if(!$('editor').classList.contains('on'))return;if(isPen(e)){canvas.classList.add('pen')}else canvas.classList.remove('pen')},true);document.addEventListener('pointerup',e=>{if(isPen(e))setTimeout(()=>canvas.classList.remove('pen'),0)},true);function restore(s){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);if(!s)return;let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);im.src=s}function undoInk(){let s=undo.pop();if(!s)return;redo.push(canvas.toDataURL());restore(s);setTimeout(()=>saveInk(false),50)}function redoInk(){let s=redo.pop();if(!s)return;undo.push(canvas.toDataURL());restore(s);setTimeout(()=>saveInk(false),50)}function saveInk(showMsg){if(!editId)return;try{localStorage.setItem('novi_ink_'+editId,canvas.toDataURL());if(showMsg){$('toast').textContent='✓ تم حفظ الملاحظات';setTimeout(()=>$('toast').textContent='✏️ القلم للكتابة • الإصبع للتصفح',1300)}}catch(e){}}function loadInk(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);let s=localStorage.getItem('novi_ink_'+editId);if(s)restore(s)}$('rec').onclick=async()=>{if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();$('rec').classList.remove('live');$('rec').textContent='🎙️';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(chunks,{type:mediaRecorder.mimeType}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='NoviStudy-'+editName+'-'+Date.now()+'.webm';a.click();stream.getTracks().forEach(t=>t.stop());setTimeout(()=>URL.revokeObjectURL(u),4000)};mediaRecorder.start();$('rec').classList.add('live');$('rec').textContent='⏹️'}catch(e){alert('اسمح للموقع باستخدام الميكروفون.')}};render();
</script></body></html>
