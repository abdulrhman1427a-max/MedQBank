<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NoviStudy | مقرراتي</title><style>:root{--n:#06496f;--i:#143c5d;--m:#7890a4;--l:#dbe6ee;--bg:#f4f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}.bar{height:76px;background:linear-gradient(90deg,#064667,#0b8bbd);display:flex;align-items:center;justify-content:space-between;padding:0 4%;color:#fff}.brand{font-size:28px;font-weight:900}.wrap{max-width:1480px;margin:auto;padding:20px}.hero,.detailHero{background:linear-gradient(120deg,#064669,#13a5dd);border-radius:28px;color:#fff;padding:30px 36px;display:flex;justify-content:space-between;gap:20px}.summary{display:flex;gap:10px}.sum{background:#ffffff16;border-radius:17px;padding:13px 18px;text-align:center}.sum b{display:block;font-size:25px}.toolsRow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.primary,.open{border:0;background:var(--n);color:#fff;border-radius:13px;padding:13px 19px;font-weight:900}.pill,.addfile,.menu,.file button,.file select{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px;font-weight:800}.pill.on{background:#e8f5ff;color:#087bb5}.search{flex:1;min-width:250px;border:1px solid var(--l);border-radius:13px;padding:0 15px}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.course,.panelCard{background:#fff;border:1px solid var(--l);border-radius:24px;padding:22px}.head,.file{display:flex;align-items:center;gap:12px}.icon{width:60px;height:60px;border-radius:17px;background:#e5f4ff;display:grid;place-items:center;font-size:29px}.title,.fileInfo{flex:1;min-width:0}.title h2{margin:0}.meta,.small{color:var(--m);font-size:13px}.info{margin:17px 0;color:#6d879a}.track{height:10px;background:#e5edf3;border-radius:10px;overflow:hidden}.fill{height:100%;background:#18a4e4}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.state{text-align:center;padding:9px;border-radius:12px}.done{background:#effbf5;color:#16865c}.review{background:#fff9e9;color:#a86d00}.inc{background:#fff2f3;color:#cf4650}.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin-top:14px}.screen{display:none}.screen.on{display:block}.file{padding:14px 2px;border-bottom:1px solid #edf2f5}.del{color:#c43d47!important}.modal{display:none;position:fixed;inset:0;background:#00182e95;place-items:center;z-index:200}.modal.on{display:grid}.box{width:min(540px,94%);background:#fff;border-radius:24px;padding:24px}.box input{width:100%;height:45px;margin:5px 0 10px;border:1px solid var(--l);border-radius:11px;padding:10px}.empty{text-align:center;padding:45px;color:var(--m)}#editorScreen{position:fixed;inset:0;z-index:100;background:#111923;direction:ltr}.editorDoc{position:absolute;inset:0;background:#fff;overflow:hidden}.preview{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;object-fit:contain}.draw{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:pan-x pan-y}.floatingTop{position:fixed;z-index:120;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:64px;padding:8px 12px;display:flex;align-items:center;gap:7px;background:rgba(18,27,38,.94);backdrop-filter:blur(20px);border:1px solid #ffffff18;border-radius:20px;box-shadow:0 12px 35px #0005;color:#fff}.ftool{width:47px;height:47px;border:0;border-radius:13px;background:transparent;color:#fff;font-size:23px;display:grid;place-items:center}.ftool.on{background:#1469aa;box-shadow:inset 0 -3px #2aa9ff}.divider{height:34px;width:1px;background:#ffffff26}.dots{display:flex;gap:7px}.dot{width:23px;height:23px;border-radius:50%;border:2px solid #ffffff55}.dot.on{outline:3px solid #299eff}.sizeBox{display:flex;align-items:center;gap:7px;font-size:12px}.sizeBox input{width:80px}.edgeBtn{position:fixed;z-index:121;top:max(16px,env(safe-area-inset-top));height:54px;border:1px solid #ffffff22;background:rgba(18,27,38,.94);backdrop-filter:blur(18px);color:#fff;border-radius:16px;padding:0 18px;font-weight:900}.backBtn{left:16px}.saveBtn{right:16px;background:#2464b8}.pageBadge{position:fixed;z-index:121;bottom:max(15px,env(safe-area-inset-bottom));right:18px;background:#162332e8;color:#fff;border-radius:15px;padding:11px 18px;font-weight:800;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{position:fixed;z-index:121;bottom:max(15px,env(safe-area-inset-bottom));left:18px;background:#162332e8;color:#dce8f2;border-radius:14px;padding:9px 13px;font-size:12px}.pop{position:fixed;z-index:130;top:86px;left:50%;transform:translateX(-50%);width:310px;background:#16212df5;color:#fff;border:1px solid #ffffff1c;border-radius:18px;padding:16px;box-shadow:0 15px 35px #0005;display:none;direction:rtl}.pop.on{display:block}.pop label{display:flex;justify-content:space-between;margin:8px 0}.pop input{width:100%}.rec.live{background:#8f2630}@media(max-width:850px){.courses{grid-template-columns:1fr}.hero{display:block}.summary{margin-top:18px}.file{flex-wrap:wrap}.floatingTop{top:auto;bottom:max(14px,env(safe-area-inset-bottom));height:58px;max-width:calc(100vw - 24px);overflow-x:auto}.ftool{min-width:42px;width:42px;height:42px}.sizeBox{display:none}.pageBadge,.hint{bottom:82px}.edgeBtn{height:48px}.pop{top:auto;bottom:82px}.dot{min-width:21px}}</style></head><body><header class="bar"><div class="brand">⚛️ NoviStudy</div><button class="pill" onclick="location.href='index.html'">← لوحة التحكم</button></header><main class="wrap"><section id="courseScreen" class="screen on"><section class="hero"><div><h1>📚 مقرراتي الدراسية</h1><p>مقرراتك وملفاتك وتقدمك الأكاديمي في مكان واحد.</p></div><div class="summary"><div class="sum"><b id="ct">0</b>المقررات</div><div class="sum"><b id="ft">0</b>الملفات</div><div class="sum"><b id="pt">0%</b>الإنجاز</div></div></section><div class="toolsRow"><button class="primary" id="addCourse">＋ إضافة مقرر</button><button class="pill on" data-f="all">الكل</button><button class="pill" data-f="active">قيد الدراسة</button><button class="pill" data-f="done">مكتمل</button><input id="search" class="search" placeholder="🔎 ابحث..."></div><section id="courses" class="courses"></section></section><section id="detailScreen" class="screen"><div class="detailHero"><div><h1 id="dname"></h1><div id="dmeta"></div></div><button class="pill" onclick="showScreen('courseScreen')">← رجوع</button></div><div class="panelCard"><h2>📁 ملفات المقرر</h2><input id="picker" type="file" multiple hidden><label class="primary" for="picker">＋ اختيار ملف من الجهاز</label><div id="files"></div></div></section></main><input id="quick" type="file" multiple hidden><section id="editorScreen" class="screen"><div class="editorDoc"><iframe id="pdfView" class="preview" hidden></iframe><img id="imgView" class="preview" hidden><div id="textView" class="preview" hidden style="padding:30px;white-space:pre-wrap;overflow:auto"></div><canvas id="ink" class="draw"></canvas></div><button class="edgeBtn backBtn" onclick="closeEditor()">‹ الرجوع</button><button class="edgeBtn saveBtn" onclick="saveInk()">حفظ</button><div class="floatingTop"><button class="ftool on" data-dtool="pen">✒️</button><button class="ftool" data-dtool="pencil">✏️</button><button class="ftool" data-dtool="highlighter">🖍️</button><button class="ftool" data-dtool="eraser">◇</button><div class="divider"></div><div class="dots"><i class="dot on" data-col="#111111" style="background:#111"></i><i class="dot" data-col="#1688e5" style="background:#1688e5"></i><i class="dot" data-col="#e23f48" style="background:#e23f48"></i><i class="dot" data-col="#ffd92f" style="background:#ffd92f"></i><i class="dot" data-col="#8b5cf6" style="background:#8b5cf6"></i></div><div class="divider"></div><div class="sizeBox"><input id="widthRange" type="range" min="1" max="24" value="4"><span id="wv">4px</span></div><button class="ftool rec" id="recordBtn">🎙️</button><div class="divider"></div><button class="ftool" onclick="undoInk()">↶</button><button class="ftool" onclick="redoInk()">↷</button><button class="ftool" id="moreBtn">•••</button></div><div class="pop" id="morePop"><label><span>شفافية التظليل</span><b id="ov">35%</b></label><input id="opacityRange" type="range" min="10" max="80" value="35"><label><span>حجم الممحاة</span><b id="ev">24px</b></label><input id="eraserRange" type="range" min="8" max="70" value="24"><p style="font-size:12px;color:#a9bed0">✏️ الكتابة والرسم بالقلم الإلكتروني فقط. إصبعك للتصفح وتحريك الملف.</p><button class="primary" style="width:100%" onclick="morePop.classList.remove('on')">تم</button></div><div class="pageBadge" id="pageBadge">NoviStudy</div><div class="hint">Apple Pencil / Stylus للكتابة • الإصبع للتصفح</div></section><div class="modal" id="courseModal"><div class="box"><h2 id="modalTitle">إضافة مقرر</h2><label>اسم المقرر</label><input id="mn"><label>رمز المقرر</label><input id="mc"><label>عدد الوحدات</label><input id="mu" type="number" value="3"><label>الأيقونة</label><input id="mi" placeholder="🫀"><div class="actions"><button class="primary" id="modalSave">حفظ</button><button class="pill" onclick="closeModal()">إلغاء</button><button class="pill del" id="deleteCourse">حذف</button></div></div></div><script>const $=x=>document.getElementById(x),KEY='novi_courses';let courses=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,editing=null,filter='all',quickId=null;function save(){localStorage.setItem(KEY,JSON.stringify(courses))}function st(x){return x.status||(x.done?'done':'incomplete')}function calc(c){c.items=c.items||[];let d=c.items.filter(x=>st(x)==='done').length;c.progress=c.items.length?Math.round(d/c.items.length*100):0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showScreen(id){document.querySelectorAll('main .screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');if(id==='courseScreen')render()}function render(){courses.forEach(calc);let q=$('search').value.toLowerCase(),list=courses.filter(c=>(c.name+' '+(c.code||'')).toLowerCase().includes(q)&&(filter==='all'||filter==='done'&&c.progress===100||filter==='active'&&c.progress<100));$('courses').innerHTML=list.length?list.map(c=>{let d=c.items.filter(x=>st(x)==='done').length,r=c.items.filter(x=>st(x)==='review').length,i=c.items.length-d-r;return `<article class="course"><div class="head"><div class="icon">${esc(c.icon||'📘')}</div><div class="title"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.code||'بدون رمز')}</div></div><button class="menu" onclick="editCourse('${c.id}')">•••</button></div><div class="info">${c.credits||0} وحدات · ${c.items.length} ملف</div><div class="track"><div class="fill" style="width:${c.progress}%"></div></div><b>${c.progress}%</b><div class="states"><div class="state done">${d} مكتملة</div><div class="state review">${r} مراجعة</div><div class="state inc">${i} لم تكتمل</div></div><div class="actions"><button class="open" onclick="openCourse('${c.id}')">فتح المقرر ←</button><label class="addfile" for="quick" onclick="quickId='${c.id}'">＋ إضافة ملف</label></div></article>`}).join(''):'<div class="empty">لا توجد مقررات</div>';let a=courses.flatMap(c=>c.items||[]),d=a.filter(x=>st(x)==='done').length;$('ct').textContent=courses.length;$('ft').textContent=a.length;$('pt').textContent=(a.length?Math.round(d/a.length*100):0)+'%';save()}function openCourse(id){current=courses.find(c=>c.id===id);$('dname').textContent=(current.icon||'📘')+' '+current.name;$('dmeta').textContent=(current.code||'بدون رمز')+' · '+(current.credits||0)+' وحدات';renderFiles();showScreen('detailScreen')}function renderFiles(){$('files').innerHTML=current.items.length?current.items.map((x,i)=>`<div class="file"><div>📄</div><div class="fileInfo"><b>${esc(x.fileName||x.name)}</b><div class="small">${esc(x.fileType||'ملف')}</div></div><button onclick="openEditor('${esc(x.fileId||'')}','${encodeURIComponent(x.fileName||x.name)}')">✏️ فتح وتحرير</button><select onchange="setStatus(${i},this.value)"><option value="incomplete" ${st(x)==='incomplete'?'selected':''}>⏱ لم يكتمل</option><option value="done" ${st(x)==='done'?'selected':''}>✅ تم الإنجاز</option><option value="review" ${st(x)==='review'?'selected':''}>🕘 مراجعة</option></select><button class="del" onclick="deleteFile(${i})">🗑 حذف</button></div>`).join(''):'<div class="empty">لا توجد ملفات بعد.</div>';save()}function setStatus(i,s){current.items[i].status=s;current.items[i].done=s==='done';save();renderFiles()}async function deleteFile(i){let x=current.items[i];if(!confirm('حذف الملف؟'))return;if(x.fileId)await dbDelete(x.fileId);current.items.splice(i,1);save();renderFiles()}function openModal(c){editing=c;$('modalTitle').textContent=c?'تخصيص المقرر':'إضافة مقرر';$('mn').value=c?c.name:'';$('mc').value=c?c.code||'':'';$('mu').value=c?c.credits||0:3;$('mi').value=c?c.icon||'':'';$('deleteCourse').style.display=c?'block':'none';$('courseModal').classList.add('on')}function closeModal(){$('courseModal').classList.remove('on')}function editCourse(id){openModal(courses.find(c=>c.id===id))}$('addCourse').onclick=()=>openModal(null);$('modalSave').onclick=()=>{let n=$('mn').value.trim();if(!n)return;if(editing){editing.name=n;editing.code=$('mc').value;editing.credits=+$('mu').value;editing.icon=$('mi').value}else courses.push({id:Date.now()+'',name:n,code:$('mc').value,credits:+$('mu').value,icon:$('mi').value,items:[]});save();closeModal();render()};$('deleteCourse').onclick=()=>{if(editing&&confirm('حذف المقرر؟')){courses=courses.filter(c=>c.id!==editing.id);save();closeModal();render()}};$('search').oninput=render;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});$('picker').onchange=async e=>{await addFiles(current,e.target.files);e.target.value=''};$('quick').onchange=async e=>{let c=courses.find(x=>x.id===quickId);if(c)await addFiles(c,e.target.files);e.target.value='';render()};async function addFiles(c,fs){for(const f of fs){let id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2);await dbPut(id,f);c.items.push({name:f.name,fileName:f.name,fileType:f.type,fileSize:f.size,fileId:id,status:'incomplete'})}save();if(current===c)renderFiles()}function db(){return new Promise((ok,no)=>{let r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(id,blob){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').put({id,blob,name:blob.name,type:blob.type});t.oncomplete=ok})}async function dbGet(id){let d=await db();return new Promise(ok=>{let r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}async function dbDelete(id){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=ok})}let editId=null,editName='',tool='pen',color='#111111',lineWidth=4,hiOpacity=.35,eraser=24,drawing=false,last=null,undoStack=[],redoStack=[],mediaRecorder,chunks=[],objectUrl=null;const canvas=$('ink'),ctx=canvas.getContext('2d');async function openEditor(id,name){if(!id)return alert('أعد إضافة هذا الملف من جهازك مرة واحدة.');editId=id;editName=decodeURIComponent(name);$('pageBadge').textContent=editName;$('editorScreen').classList.add('on');document.body.style.overflow='hidden';await showFile();setTimeout(resizeCanvas,180)}function closeEditor(){saveInk();$('editorScreen').classList.remove('on');document.body.style.overflow='';$('pdfView').hidden=$('imgView').hidden=$('textView').hidden=true;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}renderFiles()}async function showFile(){let rec=await dbGet(editId);if(!rec)return alert('لم يتم العثور على الملف على هذا الجهاز.');objectUrl=URL.createObjectURL(rec.blob);let type=rec.type||rec.blob.type||'';$('pdfView').hidden=$('imgView').hidden=$('textView').hidden=true;if(type.includes('pdf')){$('pdfView').hidden=false;$('pdfView').src=objectUrl}else if(type.startsWith('image/')){$('imgView').hidden=false;$('imgView').src=objectUrl}else if(type.startsWith('text/')){$('textView').hidden=false;$('textView').textContent=await rec.blob.text()}else{$('pdfView').hidden=false;$('pdfView').src=objectUrl}setTimeout(loadInk,300)}function resizeCanvas(){let r=canvas.getBoundingClientRect(),old=canvas.width?canvas.toDataURL():null,ratio=devicePixelRatio||1;canvas.width=r.width*ratio;canvas.height=r.height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);if(old){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}window.addEventListener('resize',()=>{if($('editorScreen').classList.contains('on'))resizeCanvas()});document.querySelectorAll('[data-dtool]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dtool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tool=b.dataset.dtool});document.querySelectorAll('[data-col]').forEach(x=>x.onclick=()=>{document.querySelectorAll('.dot').forEach(y=>y.classList.remove('on'));x.classList.add('on');color=x.dataset.col});$('widthRange').oninput=e=>{lineWidth=+e.target.value;$('wv').textContent=lineWidth+'px'};$('opacityRange').oninput=e=>{hiOpacity=+e.target.value/100;$('ov').textContent=e.target.value+'%'};$('eraserRange').oninput=e=>{eraser=+e.target.value;$('ev').textContent=eraser+'px'};$('moreBtn').onclick=()=>$('morePop').classList.toggle('on');function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function stylus(e){return e.pointerType==='pen'}canvas.addEventListener('pointerdown',e=>{if(!stylus(e))return;e.preventDefault();undoStack.push(canvas.toDataURL());if(undoStack.length>30)undoStack.shift();redoStack=[];drawing=true;last=pos(e);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drawing||!stylus(e))return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=eraser}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='highlighter'?hiOpacity:(tool==='pencil'?.65:1);let pressure=e.pressure&&e.pressure>.05?(.65+e.pressure*.7):1;ctx.lineWidth=(tool==='pencil'?Math.max(1,lineWidth*.65):lineWidth)*pressure}ctx.stroke();ctx.globalAlpha=1;last=p});canvas.addEventListener('pointerup',e=>{if(!stylus(e))return;drawing=false;saveInk()});canvas.addEventListener('pointercancel',e=>{if(!stylus(e))return;drawing=false;saveInk()});function restoreData(s){ctx.clearRect(0,0,canvas.width,canvas.height);if(!s)return;let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);im.src=s}function undoInk(){let s=undoStack.pop();if(!s)return;redoStack.push(canvas.toDataURL());restoreData(s);setTimeout(saveInk,60)}function redoInk(){let s=redoStack.pop();if(!s)return;undoStack.push(canvas.toDataURL());restoreData(s);setTimeout(saveInk,60)}function saveInk(){if(!editId)return;try{localStorage.setItem('novi_ink_'+editId,canvas.toDataURL())}catch(e){}}function loadInk(){ctx.clearRect(0,0,canvas.width,canvas.height);let s=localStorage.getItem('novi_ink_'+editId);if(s)restoreData(s)}$('recordBtn').onclick=async()=>{if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();$('recordBtn').classList.remove('live');$('recordBtn').textContent='🎙️';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(chunks,{type:mediaRecorder.mimeType}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='NoviStudy-'+editName+'-'+Date.now()+'.webm';a.click();stream.getTracks().forEach(t=>t.stop());setTimeout(()=>URL.revokeObjectURL(u),5000)};mediaRecorder.start();$('recordBtn').classList.add('live');$('recordBtn').textContent='⏹️'}catch(e){alert('اسمح للموقع باستخدام الميكروفون لتسجيل الصوت.')}};render();</script></body></html>
