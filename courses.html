<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NoviStudy | المقررات</title><link rel="stylesheet" href="novistudy-v2.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{padding:26px;max-width:1300px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.add{border:0;background:#087df2;color:#fff;border-radius:14px;padding:13px 18px;font-weight:900}.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.folder{position:relative;background:#fff;border:1px solid #dfe8f0;border-radius:22px;padding:22px;cursor:pointer}.folder .ico{font-size:38px}.folder h3{margin:10px 0 4px}.folderMenu{position:absolute;top:12px;left:12px;border:0;background:#f2f6fa;border-radius:11px;width:38px;height:38px;font-size:20px;cursor:pointer}.menuBox{display:none;position:absolute;top:54px;left:12px;z-index:20;width:165px;background:#fff;border:1px solid #dce5ed;border-radius:14px;padding:6px;box-shadow:0 12px 35px #001b3028}.menuBox.on{display:block}.menuBox button{width:100%;border:0;background:transparent;padding:10px;text-align:right;border-radius:9px}.menuBox .del{color:#c83d48}.empty{text-align:center;color:#7890a5;padding:60px}.modal{display:none;position:fixed;inset:0;background:#00182e88;z-index:700;place-items:center}.modal.on{display:grid}.box{width:min(520px,92vw);background:#fff;border-radius:24px;padding:24px}.box input{width:100%;padding:12px;border:1px solid #dce5ed;border-radius:12px;margin:8px 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{padding:18px;border:1px solid #dce5ed;border-radius:16px;background:#f7faff;font-weight:800}.items{margin-top:20px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #e0e8ee;border-radius:17px;padding:15px;margin:10px 0}.item.folderItem{cursor:pointer}.item select{padding:8px;border-radius:10px}.btn{border:0;border-radius:12px;padding:10px 14px}.primary{background:#087df2;color:#fff}.danger{background:#fff0f1;color:#c8444e}.back{cursor:pointer;color:#087df2}.crumbs{color:#7890a5;font-size:14px;margin:7px 0}.hidden{display:none!important}@media(max-width:850px){.folders{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section id="root"><div class="head"><div><h1>المقررات الدراسية</h1><p>أنشئ مجلدًا لكل مقرر.</p></div><button class="add" id="addCourse">＋ إضافة مجلد</button></div><div id="folders" class="folders"></div></section><section id="inside" class="hidden"><div class="head"><div><div class="back" id="back">← رجوع</div><div class="crumbs" id="crumbs"></div><h1 id="courseName"></h1></div><button class="add" id="plus">＋</button></div><div id="items" class="items"></div></section></main><div class="modal" id="nameModal"><div class="box"><h2 id="nameTitle">إضافة مجلد</h2><input id="nameInput" placeholder="الاسم"><button class="btn primary" id="nameSave">حفظ</button><button class="btn" onclick="nameModal.classList.remove('on')">إلغاء</button></div></div><div class="modal" id="choiceModal"><div class="box"><h2>ماذا تريد أن تضيف؟</h2><div class="choice"><button id="addChapter">📄 إضافة شابتر</button><button id="addSubfolder">📁 إضافة مجلد</button><button id="addFile">📎 إضافة ملف</button></div></div></div><input id="filePicker" type="file" multiple accept=".pdf,.ppt,.pptx,image/*" hidden><script src="novistudy-v2.js"></script><script>const KEY='novi_courses',$=x=>document.getElementById(x);let data=[],current=null,path=[],pending='course';try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};function save(){localStorage.setItem(KEY,JSON.stringify(data))}function safe(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function migrateItems(arr){(arr||[]).forEach(x=>{if(x.kind==='folder'&&!Array.isArray(x.items))x.items=[];if(x.kind==='folder')migrateItems(x.items)})}data.forEach(c=>{c.items=c.items||[];migrateItems(c.items)});save();function currentItems(){let arr=data[current].items;for(const i of path){arr[i].items=arr[i].items||[];arr=arr[i].items}return arr}function currentFolder(){if(!path.length)return data[current];let arr=data[current].items,node=null;for(const i of path){node=arr[i];arr=node.items||[]}return node}function render(){folders.innerHTML=data.length?data.map((c,i)=>`<div class="folder" onclick="openCourse(${i})"><button class="folderMenu" onclick="toggleCourseMenu(event,${i})">•••</button><div class="menuBox" id="cm${i}" onclick="event.stopPropagation()"><button onclick="renameCourse(${i})">✏️ إعادة التسمية</button><button class="del" onclick="deleteCourse(${i})">🗑️ حذف المجلد</button></div><div class="ico">📁</div><h3>${safe(c.name)}</h3><small>${(c.items||[]).length} عنصر</small></div>`).join(''):'<div class="empty">لا توجد مقررات بعد. اضغط ＋ إضافة مجلد.</div>'}window.toggleCourseMenu=(e,i)=>{e.stopPropagation();document.querySelectorAll('.menuBox').forEach(x=>x.classList.remove('on'));$('cm'+i).classList.toggle('on')};window.renameCourse=i=>{let n=prompt('اسم المجلد الجديد',data[i].name);if(n&&n.trim()){data[i].name=n.trim();save();render()}};window.deleteCourse=i=>{if(confirm(`هل تريد حذف مجلد «${data[i].name}» وكل محتوياته؟`)){data.splice(i,1);save();render()}};document.addEventListener('click',()=>document.querySelectorAll('.menuBox').forEach(x=>x.classList.remove('on')));window.openCourse=i=>{current=i;path=[];root.classList.add('hidden');inside.classList.remove('hidden');renderItems()};window.openFolder=i=>{path.push(i);renderItems()};function breadcrumb(){let names=[data[current].name],arr=data[current].items;for(const i of path){names.push(arr[i].name);arr=arr[i].items||[]}return names}function renderItems(){let arr=currentItems(),names=breadcrumb(),node=currentFolder();courseName.textContent=node.name;crumbs.textContent=names.join('  ›  ');items.innerHTML=arr.length?arr.map((x,i)=>`<div class="item ${x.kind==='folder'?'folderItem':''}" ${x.kind==='folder'?`onclick="openFolder(${i})"`:''}><div><b>${x.kind==='folder'?'📁':x.kind==='chapter'?'📄':'📎'} ${safe(x.name||x.fileName)}</b><small style="display:block;color:#789">${x.kind==='file'?(x.type||'ملف'):x.kind==='chapter'?'شابتر':'مجلد · '+(x.items||[]).length+' عنصر'}</small></div><div onclick="event.stopPropagation()">${x.kind!=='folder'?`<select onchange="status(${i},this.value)"><option value="incomplete" ${x.status==='incomplete'?'selected':''}>لم يكتمل</option><option value="review" ${x.status==='review'?'selected':''}>يحتاج مراجعة</option><option value="done" ${x.status==='done'?'selected':''}>مكتمل</option></select>`:''}<button class="btn" onclick="renameItem(${i})">إعادة تسمية</button><button class="btn danger" onclick="delItem(${i})">حذف</button>${x.kind==='folder'?'<span style="color:#087df2;margin-right:8px">فتح ←</span>':''}</div></div>`).join(''):'<div class="empty">هذا المجلد فارغ. اضغط ＋ لإضافة مجلد أو شابتر أو ملف.</div>'}window.status=(i,v)=>{currentItems()[i].status=v;save()};window.delItem=i=>{let arr=currentItems(),x=arr[i];if(confirm(`حذف «${x.name||x.fileName}»${x.kind==='folder'?' وكل محتوياته':''}؟`)){arr.splice(i,1);save();renderItems()}};window.renameItem=i=>{let x=currentItems()[i],n=prompt('الاسم الجديد',x.name||x.fileName);if(n&&n.trim()){if(x.kind==='file')x.fileName=n.trim();else x.name=n.trim();save();renderItems()}};addCourse.onclick=()=>{pending='course';nameTitle.textContent='إضافة مجلد مقرر';nameInput.value='';nameModal.classList.add('on')};plus.onclick=()=>choiceModal.classList.add('on');addChapter.onclick=()=>{choiceModal.classList.remove('on');pending='chapter';nameTitle.textContent='إضافة شابتر';nameInput.value='';nameModal.classList.add('on')};addSubfolder.onclick=()=>{choiceModal.classList.remove('on');pending='folder';nameTitle.textContent='إضافة مجلد داخل '+currentFolder().name;nameInput.value='';nameModal.classList.add('on')};addFile.onclick=()=>{choiceModal.classList.remove('on');filePicker.click()};filePicker.onchange=()=>{let arr=currentItems();[...filePicker.files].forEach(f=>arr.push({kind:'file',fileName:f.name,type:f.type||f.name.split('.').pop(),status:'incomplete'}));save();renderItems();filePicker.value=''};nameSave.onclick=()=>{let n=nameInput.value.trim();if(!n)return;if(pending==='course')data.push({name:n,items:[]});else if(pending==='folder')currentItems().push({kind:'folder',name:n,items:[]});else currentItems().push({kind:'chapter',name:n,status:'incomplete'});save();nameModal.classList.remove('on');pending==='course'?render():renderItems()};back.onclick=()=>{if(path.length){path.pop();renderItems()}else{inside.classList.add('hidden');root.classList.remove('hidden');render()}};render();</script></body></html>
