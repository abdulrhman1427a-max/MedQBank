<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقرراتي | NoviStudy</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f4f7fb;color:#153955}.bar{position:sticky;top:0;z-index:5;height:76px;padding:0 5vw;background:linear-gradient(90deg,#063958,#0876a8);color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:25px;direction:ltr}.brand img{width:44px}.back,.add,.open{border:0;border-radius:13px;font-weight:800;cursor:pointer}.back{background:#ffffff12;color:#fff;border:1px solid #ffffff45;padding:10px 16px}.wrap{max-width:1250px;margin:auto;padding:34px 24px 70px}.hero{background:linear-gradient(125deg,#063c60,#0794c9);border-radius:28px;padding:32px;color:#fff;display:flex;justify-content:space-between;align-items:center}.hero h1{margin:0 0 8px}.add{background:#fff;color:#0877a8;padding:14px 22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.sum,.course,.detailCard{background:#fff;border:1px solid #e0e9ef;border-radius:20px;padding:20px}.sum b{display:block;font-size:27px}.tools{display:flex;gap:12px;margin:22px 0}.tools input,.tools select{height:47px;border:1px solid #d7e2ea;border-radius:14px;background:#fff;padding:0 15px}.tools input{flex:1}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.course h2{margin:0}.meta{color:#7d909e}.progress{height:10px;background:#e8eff4;border-radius:10px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:#139ee5}.open{width:100%;height:44px;background:#073f62;color:#fff;margin-top:15px}.modal{display:none;position:fixed;inset:0;background:#001a2d88;z-index:10;place-items:center;padding:20px}.modal.on{display:grid}.box{width:min(600px,100%);background:#fff;border-radius:26px;padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-weight:800}.field input,.field select{width:100%;height:47px;border:1px solid #d6e1e8;border-radius:12px;padding:0 12px}.actions{display:flex;gap:10px}.save,.cancel{flex:1;border:0;border-radius:13px;height:48px;font-weight:900}.save{background:#087fc0;color:#fff}.detail{display:none}.detail.on{display:block}.mainview.hide{display:none}.contentItem{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #edf2f5}@media(max-width:800px){.summary,.courses,.grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start;gap:20px}}</style></head><body><header class="bar"><div class="brand"><img src="novistudy-logo.svg">NoviStudy</div><button class="back" onclick="location.href='index.html'">← لوحة التحكم</button></header><main class="wrap"><div class="mainview" id="mainview"><section class="hero"><div><h1>📚 مقرراتي الدراسية</h1><p>نظّم مقرراتك وملفاتك وتقدمك الأكاديمي.</p></div><button class="add" id="add">＋ إضافة مقرر جديد</button></section><section class="summary"><div class="sum">عدد المقررات<b id="count">0</b></div><div class="sum">إجمالي الوحدات<b id="credits">0</b></div><div class="sum">متوسط الإنجاز<b id="avg">0%</b></div><div class="sum">كل الملفات<b id="fileCount">0</b></div></section><div class="tools"><input id="search" placeholder="🔎 ابحث باسم المقرر..."><select id="filter"><option value="all">كل المقررات</option><option value="active">الحالية</option><option value="done">المكتملة</option></select></div><section class="courses" id="courses"></section></div><section class="detail" id="detail"><section class="hero"><div><h1 id="dtitle">المقرر</h1><p id="dmeta"></p></div><button class="add" onclick="closeDetail()">العودة للمقررات</button></section><div class="detailCard" style="margin-top:20px"><h2>📁 ملفات ومحتوى المقرر</h2><p>كل ملف جديد يبدأ تلقائياً بحالة «لم يكتمل». ويمكنك تغييره إلى «تم الإنجاز» أو «يحتاج مراجعة».</p><div id="items"></div><button class="open" onclick="addContent()">＋ إضافة ملف / محاضرة / فصل</button></div></section></main><div class="modal" id="modal"><div class="box"><h2>إضافة مقرر جديد</h2><div class="grid"><div class="field"><label>اسم المقرر</label><input id="name"></div><div class="field"><label>رمز المقرر</label><input id="code"></div><div class="field"><label>عدد الوحدات</label><input id="cr" type="number" value="3"></div><div class="field"><label>نوع المحتوى</label><select id="type"><option>محاضرات</option><option>فصول</option><option>ملفات</option></select></div></div><div class="actions"><button class="save" id="save">حفظ</button><button class="cancel" id="cancel">إلغاء</button></div></div></div><script>const $=x=>document.getElementById(x);let courses=JSON.parse(localStorage.getItem('novi_courses')||'[]'),current=null;function persist(){localStorage.setItem('novi_courses',JSON.stringify(courses))}function calc(c){c.done=(c.items||[]).filter(x=>(x.status||(x.done?'done':'incomplete'))==='done').length;c.progress=c.items.length?Math.round(c.done/c.items.length*100):0}function render(){courses.forEach(calc);let q=$('search').value.toLowerCase(),f=$('filter').value,list=courses.filter(c=>(c.name+' '+c.code).toLowerCase().includes(q)&&(f==='all'||(f==='done'?c.progress===100:c.progress<100)));$('courses').innerHTML=list.map(c=>`<article class="course"><h2>📘 ${esc(c.name)}</h2><div class="meta">${esc(c.code||'بدون رمز')} · ${c.credits} وحدات</div><div class="progress"><span style="width:${c.progress}%"></span></div><b>${c.progress}%</b><button class="open" onclick="openCourse('${c.id}')">فتح المقرر ←</button></article>`).join('');$('count').textContent=courses.length;$('credits').textContent=courses.reduce((a,c)=>a+Number(c.credits||0),0);$('avg').textContent=(courses.length?Math.round(courses.reduce((a,c)=>a+c.progress,0)/courses.length):0)+'%';$('fileCount').textContent=courses.reduce((a,c)=>a+(c.items||[]).length,0);persist()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('add').onclick=()=>$('modal').classList.add('on');$('cancel').onclick=()=>$('modal').classList.remove('on');$('save').onclick=()=>{let n=$('name').value.trim();if(!n)return alert('اكتب اسم المقرر');courses.push({id:Date.now().toString(),name:n,code:$('code').value.trim(),credits:Number($('cr').value||0),type:$('type').value,progress:0,done:0,items:[]});persist();$('modal').classList.remove('on');render()};$('search').oninput=render;$('filter').onchange=render;function openCourse(id){current=courses.find(c=>c.id===id);$('mainview').classList.add('hide');$('detail').classList.add('on');$('dtitle').textContent='📘 '+current.name;$('dmeta').textContent=current.code||'بدون رمز';renderItems()}function closeDetail(){$('detail').classList.remove('on');$('mainview').classList.remove('hide');render()}function addContent(){let n=prompt('اسم الملف / المحاضرة / الفصل');if(!n)return;current.items=current.items||[];current.items.push({name:n,status:'incomplete',done:false});calc(current);persist();renderItems()}function setStatus(i,s){current.items[i].status=s;current.items[i].done=s==='done';calc(current);persist();renderItems()}function renderItems(){$('items').innerHTML=(current.items||[]).length?current.items.map((x,i)=>{let s=x.status||(x.done?'done':'incomplete');return `<div class="contentItem" style="gap:12px;flex-wrap:wrap"><div style="flex:1"><b>📄 ${esc(x.name)}</b><small style="display:block;color:#7b8e9c">${s==='done'?'تم الإنجاز':s==='review'?'يحتاج مراجعة':'لم يكتمل'}</small></div><select onchange="setStatus(${i},this.value)" style="height:40px;border:1px solid #d6e1e8;border-radius:11px;padding:0 10px"><option value="incomplete" ${s==='incomplete'?'selected':''}>⏱ لم يكتمل</option><option value="done" ${s==='done'?'selected':''}>✅ تم الإنجاز</option><option value="review" ${s==='review'?'selected':''}>🕘 يحتاج مراجعة</option></select></div>`}).join(''):'<p style="color:#7b8e9c">لا توجد ملفات بعد.</p>'}render();</script></body></html>
