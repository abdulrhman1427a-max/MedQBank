<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NoviStudy | مقرراتي</title><style>
:root{--blue:#0a84ff;--ink:#172b3b;--muted:#7d8d9a;--line:#e3e8ee;--bg:#f5f7fa;--green:#28a879;--red:#e4545c;--yellow:#d99b13}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}.screen{display:none}.screen.on{display:block}.top{height:72px;background:linear-gradient(90deg,#075074,#129fd0);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-size:27px;font-weight:900}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:750;cursor:pointer}.primary{background:#075174;color:#fff}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.wrap{max-width:1450px;margin:auto;padding:24px}.hero{background:linear-gradient(120deg,#075174,#13a1d4);border-radius:28px;color:#fff;padding:28px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{margin:0 0 8px}.summary{display:flex;gap:10px}.stat{background:#ffffff1c;border:1px solid #ffffff22;border-radius:16px;padding:12px 18px;text-align:center}.stat b{font-size:25px;display:block}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.search{flex:1;min-width:240px;border:1px solid var(--line);border-radius:14px;padding:0 16px;background:#fff}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 5px 20px #143c5d08}.head{display:flex;align-items:center;gap:13px}.icon{width:58px;height:58px;border-radius:17px;background:#e7f5ff;display:grid;place-items:center;font-size:29px}.grow{flex:1;min-width:0}.grow h2{margin:0}.muted{color:var(--muted);font-size:13px}.track{height:9px;background:#e8eff4;border-radius:20px;overflow:hidden;margin:17px 0 7px}.fill{height:100%;background:linear-gradient(90deg,#168fca,#22b4eb)}.states{display:grid;grid-template-columns:repeat(3,1f /* Notes-style editor */#editor{position:fixed;inset:0;z-index:400;background:#dfe3e8;direction:ltr;overflow:hidden}.doc{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#dfe3e8;padding:78px 0 40px}.preview{display:block;width:min(1100px,100%);min-height:calc(100vh - 78px);margin:0 auto;border:0;background:#fff;box-shadow:0 1px 5px #0002}.preview[hidden]{display:none!important}#img{object-fit:contain;height:auto}.ink{position:fixed;inset:0;width:100vw;height:100dvh;z-index:10;pointer-events:auto;touch-action:pan-x pan-y}.noteTop{position:fixed;z-index:30;top:0;left:0;right:0;height:66px;padding:max(7px,env(safe-area-inset-top)) 16px 7px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#fbfbfbeF;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid #cfd5dc;box-shadow:0 1px 8px #00000010;direction:ltr}.noteLeft,.noteRight{display:flex;align-items:center;gap:8px}.noteRight{justify-content:flex-end}.noteTitle{font-weight:700;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:#27323c}.navBtn,.iconBtn{height:40px;border:0;border-radius:11px;background:transparent;color:#087af1;font-weight:650;font-size:16px;padding:0 10px}.iconBtn{width:40px;padding:0;font-size:22px;color:#29333d}.iconBtn:active,.navBtn:active{background:#e7ebef}.saved{font-size:12px;color:#788692;min-width:65px;text-align:right}.toolDock{position:fixed;z-index:32;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:7px;background:#f9f9f9ee;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid #cfd5dc;border-radius:18px;box-shadow:0 8px 30px #0003;direction:ltr}.tool{width:44px;height:44px;border:0;border-radius:12px;background:transparent;font-size:21px;display:grid;place-items:center;color:#26333f}.tool.on{background:#dceeff;color:#087af1}.divider{width:1px;height:29px;background:#d5d9de;margin:0 2px}.colorDot{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbc2c9}.colorDot.on{box-shadow:0 0 0 3px #0a84ff}.toolPanel{display:none;position:fixed;z-index:35;bottom:86px;left:50%;transform:translateX(-50%);width:min(370px,calc(100vw - 24px));background:#fbfbfbf5;backdrop-filter:blur(25px);border:1px solid #d2d7dc;border-radius:20px;padding:16px;box-shadow:0 12px 36px #0003;direction:rtl}.toolPanel.on{display:block}.toolPanel h3{margin:0 0 12px}.toolPanel label{display:flex;justify-content:space-between;margin:11px 0 6px}.toolPanel input{width:100%}.palette{display:flex;gap:12px;justify-content:center;margin:12px 0}.rec.live{background:#ffe3e5;color:#d52d3a}.toast{position:fixed;z-index:31;bottom:92px;left:16px;background:#25313cdd;color:#fff;padding:8px 12px;border-radius:11px;font-size:12px;opacity:0;transition:.25s}.toast.show{opacity:1}

</style></head><body>
<header class="top"><div class="brand">⚛️ NoviStudy</div><button class="btn light" onclick="location.href='index.html'">← لوحة التحكم</button></header>
<main class="wrap"><section id="courseScreen" class="screen on"><section class="hero"><div><h1>📚 مقرراتي الدراسية</h1><div>نظّم مقرراتك وملفاتك وتقدمك الأكاديمي.</div></div><div class="summary"><div class="stat"><b id="ct">0</b>مقرر</div><div class="stat"><b id="ft">0</b>ملف</div><div class="stat"><b id="pt">0%</b>إنجاز</div></div></section><div class="toolbar"><button class="btn primary" id="addCourse">＋ إضافة مقرر</button><input id="search" class="search" placeholder="🔎 ابحث باسم المقرر..."></div><section id="courses" class="courses"></section></section><section id="detailScreen" class="screen"><div class="detailHero"><div><h1 id="dname"></h1><div id="dmeta" class="muted"></div></div><button class="btn light" onclick="show('courseScreen')">← رجوع</button></div><div class="panel"><h2>📁 ملفات المقرر</h2><input id="picker" type="file" multiple style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0"><button type="button" class="btn primary" id="pickFilesBtn">＋ اختيار ملف من الجهاز</button><div id="files"></div></div></section></main><input id="quick" type="file" multiple style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0">
<section id="editor" class="screen"><div class="doc" id="doc"><iframe id="pdf" class="preview" hidden></iframe><img id="img" class="preview" hidden><div id="txt" class="preview" hidden style="padding:40px;white-space:pre-wrap"></div></div><canvas id="ink" class="ink"></canvas><div class="noteTop"><div class="noteLeft"><button class="navBtn" onclick="closeEditor()">‹ الملفات</button><button class="iconBtn" onclick="undoInk()">↶</button><button class="iconBtn" onclick="redoInk()">↷</button></div><div class="noteTitle" id="noteTitle">NoviStudy</div><div class="noteRight"><span class="saved" id="saved">تم الحفظ</span><button class="iconBtn rec" id="rec" title="تسجيل صوتي">🎙</button><button class="iconBtn" id="more">•••</button></div></div><div class="toolDock"><button class="tool on" data-tool="pen" title="قلم">✒️</button><button class="tool" data-tool="pencil" title="رصاص">✏️</button><button class="tool" data-tool="highlighter" title="تظليل">🖍️</button><button class="tool" data-tool="eraser" title="ممحاة">⌫</button><div class="divider"></div><i class="colorDot on" data-color="#111111" style="background:#111"></i><i class="colorDot" data-color="#1688e5" style="background:#1688e5"></i><i class="colorDot" data-color="#e33f49" style="background:#e33f49"></i><i class="colorDot" data-color="#ffd92f" style="background:#ffd92f"></i><i class="colorDot" data-color="#8b5cf6" style="background:#8b5cf6"></i><div class="divider"></div><button class="tool" id="toolOptions">⌁</button></div><div class="toolPanel" id="toolPanel"><h3>تخصيص الأداة</h3><label><span>السُمك</span><b id="widthText">4 px</b></label><input id="width" type="range" min="1" max="20" value="4"><label><span>شفافية التظليل</span><b id="opText">35%</b></label><input id="opacity" type="range" min="10" max="80" value="35"><label><span>حجم الممحاة</span><b id="erText">24 px</b></label><input id="eraser" type="range" min="8" max="70" value="24"><div class="palette"><i class="colorDot" data-color="#111111" style="background:#111"></i><i class="colorDot" data-color="#1688e5" style="background:#1688e5"></i><i class="colorDot" data-color="#e33f49" style="background:#e33f49"></i><i class="colorDot" data-color="#ffd92f" style="background:#ffd92f"></i><i class="colorDot" data-color="#8b5cf6" style="background:#8b5cf6"></i></div><div style="font-size:12px;color:#6d7a85;text-align:center">Apple Pencil / Stylus للكتابة • الإصبع للتصفح</div></div><div class="toast" id="toast">تم الحفظ تلقائيًا</div></section>
<div class="modal" id="courseModal"><div class="box"><h2 id="modalTitle">إضافة مقرر</h2><label>اسم المقرر</label><input id="mn"><label>رمز المقرر</label><input id="mc"><label>عدد الوحدات</label><input id="mu" type="number" value="3"><label>الأيقونة</label><input id="mi" placeholder="🫀"><div class="actions"><button class="btn primary" id="modalSave">حفظ</button><button class="btn light" onclick="closeModal()">إلغاء</button></div><button class="btn light danger" id="deleteCourse" style="width:100%;margin-top:9px">حذف المقرر</button></div></div>
<script>
const $=id=>document.getElementById(id),KEY='novi_courses';let courses=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,editing=null,quickId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(courses))}function status(x){return x.status||(x.done?'done':'incomplete')}function calc(c){c.items=c.items||[];let d=c.items.filter(x=>status(x)==='done').length;c.progress=c.items.length?Math.round(d/c.items.length*100):0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){document.querySelectorAll('main .screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');if(id==='courseScreen')render()}
function render(){courses.forEach(calc);let q=$('search').value.toLowerCase(),list=courses.filter(c=>(c.name+' '+(c.code||'')).toLowerCase().includes(q));$('courses').innerHTML=list.length?list.map(c=>{let d=c.items.filter(x=>status(x)==='done').length,r=c.items.filter(x=>status(x)==='review').length,i=c.items.length-d-r;return `<article class="card"><div class="head"><div class="icon">${esc(c.icon||'📘')}</div><div class="grow"><h2>${esc(c.name)}</h2><div class="muted">${esc(c.code||'بدون رمز')} · ${c.credits||0} وحدات · ${c.items.length} ملف</div></div><button class="btn light" onclick="editCourse('${c.id}')">•••</button></div><div class="track"><div class="fill" style="width:${c.progress}%"></div></div><b>${c.progress}%</b><div class="states"><div class="state done">${d} مكتملة</div><div class="state review">${r} مراجعة</div><div class="state inc">${i} لم تكتمل</div></div><div class="actions"><button class="btn primary" onclick="openCourse('${c.id}')">فتح المقرر ←</button><button type="button" class="btn light" onclick="openQuickPicker('${c.id}')">＋ إضافة ملف</button></div></article>`}).join(''):'<div class="empty">لا توجد مقررات بعد.</div>';let all=courses.flatMap(c=>c.items||[]),done=all.filter(x=>status(x)==='done').length;$('ct').textContent=courses.length;$('ft').textContent=all.length;$('pt').textContent=(all.length?Math.round(done/all.length*100):0)+'%';save()}
function openCourse(id){current=courses.find(c=>c.id===id);$('dname').textContent=(current.icon||'📘')+' '+current.name;$('dmeta').textContent=(current.code||'بدون رمز')+' · '+(current.credits||0)+' وحدات';renderFiles();show('detailScreen')}
function renderFiles(){if(!current)return;$('files').innerHTML=current.items.length?current.items.map((x,i)=>`<div class="file"><div style="font-size:25px">📄</div><div class="grow"><b>${esc(x.fileName||x.name)}</b><div class="muted">${esc(x.fileType||'ملف')}</div></div><button class="btn primary" onclick="openEditor('${x.fileId}')">فتح</button><select onchange="setStatus(${i},this.value)"><option value="incomplete" ${status(x)==='incomplete'?'selected':''}>لم يكتمل</option><option value="review" ${status(x)==='review'?'selected':''}>يحتاج مراجعة</option><option value="done" ${status(x)==='done'?'selected':''}>تم الإنجاز</option></select><button class="btn light danger" onclick="deleteFile(${i})">حذف</button></div>`).join(''):'<div class="empty">لا توجد ملفات. اختر ملفًا من جهازك.</div>'}
function setStatus(i,v){current.items[i].status=v;save();renderFiles()}function deleteFile(i){if(confirm('حذف الملف؟')){current.items.splice(i,1);save();renderFiles()}}
const DB_NAME='NoviStudyFiles',DB_VERSION=2,STORE='files';
function db(){return new Promise((ok,no)=>{if(!('indexedDB' in window))return no(new Error('IndexedDB غير مدعوم'));let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error||new Error('تعذر فتح قاعدة الملفات'));r.onblocked=()=>no(new Error('قاعدة الملفات مستخدمة في تبويب آخر'))})}
async function putBlob(id,b){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(b,id);t.oncomplete=()=>{d.close();ok()};t.onerror=()=>{let e=t.error;d.close();no(e)};t.onabort=()=>{let e=t.error;d.close();no(e)}})}
async function getBlob(id){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(id);r.onsuccess=()=>{let v=r.result;d.close();ok(v)};r.onerror=()=>{let e=r.error;d.close();no(e)}})}
async function addFiles(list,c){if(!c||!list||!list.length)return;let added=0;try{c.items=c.items||[];for(const f of list){if(!f||!f.name)continue;let id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2);await putBlob(id,f);c.items.push({fileId:id,fileName:f.name,fileType:f.type||'application/octet-stream',fileSize:f.size||0,status:'incomplete'});added++}save();if(current&&current.id===c.id)renderFiles();render();if(added)toastMessage('تمت إضافة '+added+' ملف بنجاح')}catch(err){console.error('File upload failed',err);alert('تعذر إضافة الملف. تأكد أن التصفح الخاص غير مفعّل وأن هناك مساحة تخزين كافية، ثم حاول مرة أخرى.')}}
function toastMessage(msg){let t=$('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
$('pickFilesBtn').addEventListener('click',()=>{let p=$('picker');p.value='';p.click()});function openQuickPicker(id){quickId=id;let q=$('quick');q.value='';q.click()}window.openQuickPicker=openQuickPicker;$('picker').addEventListener('change',async e=>{let files=Array.from(e.target.files||[]);e.target.value='';await addFiles(files,current)});
$('quick').addEventListener('change',async e=>{let files=Array.from(e.target.files||[]),c=courses.find(x=>x.id===quickId);e.target.value='';quickId=null;if(c)await addFiles(files,c)});$('search').oninput=render;
$('addCourse').onclick=()=>{editing=null;$('modalTitle').textContent='إضافة مقرر';$('mn').value='';$('mc').value='';$('mu').value=3;$('mi').value='📘';$('deleteCourse').style.display='none';$('courseModal').classList.add('on')};function editCourse(id){editing=courses.find(c=>c.id===id);$('modalTitle').textContent='تعديل المقرر';$('mn').value=editing.name;$('mc').value=editing.code||'';$('mu').value=editing.credits||0;$('mi').value=editing.icon||'📘';$('deleteCourse').style.display='block';$('courseModal').classList.add('on')}function closeModal(){$('courseModal').classList.remove('on')}$('modalSave').onclick=()=>{let n=$('mn').value.trim();if(!n)return alert('اكتب اسم المقرر');if(editing){Object.assign(editing,{name:n,code:$('mc').value,credits:+$('mu').value,icon:$('mi').value||'📘'})}else courses.push({id:'c'+Date.now(),name:n,code:$('mc').value,credits:+$('mu').value,icon:$('mi').value||'📘',items:[]});save();closeModal();render()};$('deleteCourse').onclick=()=>{if(editing&&confirm('حذف المقرر؟')){courses=courses.filter(c=>c!==editing);save();closeModal();render()}};
let editorFile=null,objectURL=null,tool='pen',color='#111111',drawing=false,last=null,undo=[],redo=[];const canvas=$('ink'),ctx=canvas.getContext('2d');function resizeCanvas(){let old=canvas.toDataURL();canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.scale(devicePixelRatio,devicePixelRatio);if(old&&old.length>30){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,innerWidth,innerHeight);im.src=old}}addEventListener('resize',resizeCanvas);resizeCanvas();
async function openEditor(id){let blob=await getBlob(id);if(!blob)return alert('الملف غير موجود على هذا الجهاز');editorFile=id;let item=courses.flatMap(c=>c.items||[]).find(x=>x.fileId===id);$('noteTitle').textContent=item?.fileName||'NoviStudy';['pdf','img','txt'].forEach(x=>$(x).hidden=true);if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);if(blob.type.includes('pdf')){$('pdf').src=objectURL;$('pdf').hidden=false}else if(blob.type.startsWith('image/')){$('img').src=objectURL;$('img').hidden=false}else{try{$('txt').textContent=await blob.text();$('txt').hidden=false}catch(e){alert('لا يمكن عرض هذا النوع')}}document.querySelector('body>.top').style.display='none';document.querySelector('main').style.display='none';$('editor').classList.add('on');resizeCanvas();loadInk()}
function closeEditor(){saveInk();$('editor').classList.remove('on');document.querySelector('body>.top').style.display='flex';document.querySelector('main').style.display='block';if(objectURL)URL.revokeObjectURL(objectURL)}
function inkKey(){return 'novi_ink_'+editorFile}function loadInk(){ctx.clearRect(0,0,innerWidth,innerHeight);let s=localStorage.getItem(inkKey());if(s){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,innerWidth,innerHeight);im.src=s}}function saveInk(showToast=false){if(!editorFile)return;try{localStorage.setItem(inkKey(),canvas.toDataURL('image/png'));$('saved').textContent='تم الحفظ';if(showToast)toast()}catch(e){$('saved').textContent='تعذر الحفظ'}}function toast(){$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)}function snapshot(){undo.push(canvas.toDataURL());if(undo.length>20)undo.shift();redo=[];$('saved').textContent='جارٍ الحفظ…'}function restore(src){let im=new Image;im.onload=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);ctx.drawImage(im,0,0,innerWidth,innerHeight)};im.src=src}function undoInk(){if(!undo.length)return;redo.push(canvas.toDataURL());restore(undo.pop());setTimeout(saveInk,80)}function redoInk(){if(!redo.length)return;undo.push(canvas.toDataURL());restore(redo.pop());setTimeout(saveInk,80)}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='pen'&&e.pointerType!=='mouse')return; e.preventDefault();snapshot();drawing=true;last={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let x=e.clientX,y=e.clientY,w=+$('width').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=tool==='highlighter'?+$('opacity').value/100:tool==='pencil'?.65:1;ctx.strokeStyle=color;ctx.lineWidth=tool==='eraser'?+$('eraser').value:tool==='pencil'?Math.max(1,w*.65):w;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke();last={x,y}});function endDraw(){if(!drawing)return;drawing=false;ctx.globalAlpha=1;setTimeout(saveInk,250)}canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('on',x.dataset.color===color))});$('toolOptions').onclick=()=>$('toolPanel').classList.toggle('on');$('more').onclick=()=>$('toolPanel').classList.toggle('on');$('width').oninput=e=>$('widthText').textContent=e.target.value+' px';$('opacity').oninput=e=>$('opText').textContent=e.target.value+'%';$('eraser').oninput=e=>$('erText').textContent=e.target.value+' px';
let recorder=null,chunks=[];$('rec').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{$('rec').classList.remove('live');stream.getTracks().forEach(t=>t.stop());let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));a.download='NoviStudy-recording.webm';a.click()};recorder.start();$('rec').classList.add('live')}catch(e){alert('اسمح للموقع باستخدام الميكروفون أولاً')}};
render();
</script></body></html>
