<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>مقرراتي | NoviStudy</title><style>:root{--n:#06496f;--i:#143c5d;--m:#7890a4;--l:#dbe6ee;--bg:#f4f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}.bar{height:78px;background:linear-gradient(90deg,#064667,#0b8bbd);display:flex;align-items:center;justify-content:space-between;padding:0 4%;color:#fff}.brand{font-size:28px;font-weight:900}.wrap{max-width:1480px;margin:auto;padding:20px}.hero,.detailHero{background:linear-gradient(120deg,#064669,#13a5dd);border-radius:28px;color:#fff;padding:30px 36px;display:flex;justify-content:space-between;gap:20px}.summary{display:flex;gap:10px}.sum{background:#ffffff16;border-radius:17px;padding:13px 18px;text-align:center}.sum b{display:block;font-size:25px}.toolsRow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.primary,.open{border:0;background:var(--n);color:#fff;border-radius:13px;padding:13px 19px;font-weight:900}.pill,.addfile,.menu,.file button,.file select{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px;font-weight:800}.pill.on{background:#e8f5ff;color:#087bb5}.search{flex:1;min-width:250px;border:1px solid var(--l);border-radius:13px;padding:0 15px}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.course,.panelCard{background:#fff;border:1px solid var(--l);border-radius:24px;padding:22px}.head,.file{display:flex;align-items:center;gap:12px}.icon{width:60px;height:60px;border-radius:17px;background:#e5f4ff;display:grid;place-items:center;font-size:29px}.title,.fileInfo{flex:1;min-width:0}.title h2{margin:0}.meta,.small{color:var(--m);font-size:13px}.info{margin:17px 0;color:#6d879a}.track{height:10px;background:#e5edf3;border-radius:10px;overflow:hidden}.fill{height:100%;background:#18a4e4}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.state{text-align:center;padding:9px;border-radius:12px}.done{background:#effbf5;color:#16865c}.review{background:#fff9e9;color:#a86d00}.inc{background:#fff2f3;color:#cf4650}.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin-top:14px}.screen{display:none}.screen.on{display:block}.file{padding:14px 2px;border-bottom:1px solid #edf2f5}.del{color:#c43d47!important}.modal{display:none;position:fixed;inset:0;background:#00182e95;place-items:center;z-index:80}.modal.on{display:grid}.box{width:min(540px,94%);background:#fff;border-radius:24px;padding:24px}.box input{width:100%;height:45px;margin:5px 0 10px;border:1px solid var(--l);border-radius:11px;padding:10px}.empty{text-align:center;padding:45px;color:var(--m)}#editorScreen{position:fixed;inset:0;z-index:60;background:#eef3f8}.editorTop{height:66px;background:linear-gradient(90deg,#064568,#0b8dbc);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px}.editorTop b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.editorTop button{border:1px solid #ffffff55;background:#ffffff10;color:#fff;border-radius:11px;padding:9px 13px;font-weight:800}.editorWork{height:calc(100vh - 66px);display:grid;grid-template-columns:1fr 92px}.stage{overflow:auto;padding:20px;display:grid;place-items:start center}.page{position:relative;background:#fff;width:min(900px,100%);height:calc(100vh - 105px);box-shadow:0 8px 35px #173b5720;overflow:hidden}.preview{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#fff}.draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:4}.editTools{background:#fff;border-right:1px solid #d9e4ec;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;overflow:auto}.tool{width:66px;min-height:55px;border:1px solid #d9e4ec;background:#fff;border-radius:14px;font-size:12px;font-weight:800}.tool span{display:block;font-size:22px}.tool.on{background:#e8f5ff;border-color:#63bceb;color:#0879b3}.colors{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.color{width:23px;height:23px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c8d5df}.color.on{box-shadow:0 0 0 3px #65b8e6}.customPanel{position:fixed;right:105px;top:80px;width:270px;background:#fff;border:1px solid #d8e3eb;border-radius:18px;padding:16px;box-shadow:0 12px 35px #173b5725;z-index:70;display:none}.customPanel.on{display:block}.customPanel input{width:100%}.rec.live{background:#fff0f1;color:#c93e48}@media(max-width:800px){.courses{grid-template-columns:1fr}.hero{display:block}.summary{margin-top:18px}.file{flex-wrap:wrap}.editorWork{grid-template-columns:1fr 74px}.tool{width:58px}.stage{padding:8px}.customPanel{right:80px}}</style></head><body><header class="bar"><div class="brand">⚛️ NoviStudy</div><button class="pill" onclick="location.href='index.html'">← لوحة التحكم</button></header><main class="wrap"><section id="courseScreen" class="screen on"><section class="hero"><div><h1>📚 مقرراتي الدراسية</h1><p>مقرراتك وملفاتك وتقدمك الأكاديمي في مكان واحد.</p></div><div class="summary"><div class="sum"><b id="ct">0</b>المقررات</div><div class="sum"><b id="ft">0</b>الملفات</div><div class="sum"><b id="pt">0%</b>الإنجاز</div></div></section><div class="toolsRow"><button class="primary" id="addCourse">＋ إضافة مقرر</button><button class="pill on" data-f="all">الكل</button><button class="pill" data-f="active">قيد الدراسة</button><button class="pill" data-f="done">مكتمل</button><input id="search" class="search" placeholder="🔎 ابحث..."></div><section id="courses" class="courses"></section></section><section id="detailScreen" class="screen"><div class="detailHero"><div><h1 id="dname"></h1><div id="dmeta"></div></div><button class="pill" onclick="showScreen('courseScreen')">← رجوع</button></div><div class="panelCard"><h2>📁 ملفات المقرر</h2><input id="picker" type="file" multiple hidden><label class="primary" for="picker">＋ اختيار ملف من الجهاز</label><div id="files"></div></div></section></main><input id="quick" type="file" multiple hidden><section id="editorScreen" class="screen"><header class="editorTop"><button onclick="closeEditor()">← الملفات</button><b id="editorTitle">محرر الملف</b><button onclick="undoInk()">↶ تراجع</button><button onclick="clearInk()">مسح الكتابة</button></header><div class="editorWork"><div class="stage"><div class="page" id="editPage"><iframe id="pdfView" class="preview" hidden></iframe><img id="imgView" class="preview" hidden><div id="textView" class="preview" hidden style="padding:25px;white-space:pre-wrap;overflow:auto"></div><canvas id="ink" class="draw"></canvas></div></div><aside class="editTools"><button class="tool on" data-dtool="pen"><span>✒️</span>قلم</button><div class="colors" id="penColors"><i class="color on" data-col="#111111" style="background:#111"></i><i class="color" data-col="#1688e5" style="background:#1688e5"></i><i class="color" data-col="#e23f48" style="background:#e23f48"></i></div><button class="tool" data-dtool="pencil"><span>✏️</span>رصاص</button><button class="tool" data-dtool="highlighter"><span>🖍️</span>تظليل</button><div class="colors" id="hiColors"><i class="color" data-col="#ffd92f" style="background:#ffd92f"></i><i class="color" data-col="#ff5360" style="background:#ff5360"></i><i class="color" data-col="#a768e8" style="background:#a768e8"></i></div><button class="tool" data-dtool="eraser"><span>🧽</span>ممحاة</button><button class="tool" id="customBtn"><span>⚙️</span>تخصيص</button><button class="tool rec" id="recordBtn"><span>🎙️</span>تسجيل</button></aside></div></section><div class="customPanel" id="customPanel"><b>تخصيص الأدوات</b><p>سُمك القلم: <span id="wv">4</span> px</p><input id="widthRange" type="range" min="1" max="30" value="4"><p>شفافية التظليل: <span id="ov">35</span>%</p><input id="opacityRange" type="range" min="10" max="80" value="35"><p>حجم الممحاة: <span id="ev">24</span> px</p><input id="eraserRange" type="range" min="8" max="70" value="24"><button class="primary" style="width:100%;margin-top:12px" onclick="customPanel.classList.remove('on')">تم</button></div><div class="modal" id="courseModal"><div class="box"><h2 id="modalTitle">إضافة مقرر</h2><label>اسم المقرر</label><input id="mn"><label>رمز المقرر</label><input id="mc"><label>عدد الوحدات</label><input id="mu" type="number" value="3"><label>الأيقونة</label><input id="mi" placeholder="🫀"><div class="actions"><button class="primary" id="modalSave">حفظ</button><button class="pill" onclick="closeModal()">إلغاء</button><button class="pill del" id="deleteCourse">حذف</button></div></div></div><script>const $=x=>document.getElementById(x),KEY='novi_courses';let courses=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,editing=null,filter='all',quickId=null;function save(){localStorage.setItem(KEY,JSON.stringify(courses))}function st(x){return x.status||(x.done?'done':'incomplete')}function calc(c){c.items=c.items||[];let d=c.items.filter(x=>st(x)==='done').length;c.progress=c.items.length?Math.round(d/c.items.length*100):0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showScreen(id){document.querySelectorAll('main .screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');if(id==='courseScreen')render()}function render(){courses.forEach(calc);let q=$('search').value.toLowerCase(),list=courses.filter(c=>(c.name+' '+(c.code||'')).toLowerCase().includes(q)&&(filter==='all'||filter==='done'&&c.progress===100||filter==='active'&&c.progress<100));$('courses').innerHTML=list.length?list.map(c=>{let d=c.items.filter(x=>st(x)==='done').length,r=c.items.filter(x=>st(x)==='review').length,i=c.items.length-d-r;return `<article class="course"><div class="head"><div class="icon">${esc(c.icon||'📘')}</div><div class="title"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.code||'بدون رمز')}</div></div><button class="menu" onclick="editCourse('${c.id}')">•••</button></div><div class="info">${c.credits||0} وحدات · ${c.items.length} ملف</div><div class="track"><div class="fill" style="width:${c.progress}%"></div></div><b>${c.progress}%</b><div class="states"><div class="state done">${d} مكتملة</div><div class="state review">${r} مراجعة</div><div class="state inc">${i} لم تكتمل</div></div><div class="actions"><button class="open" onclick="openCourse('${c.id}')">فتح المقرر ←</button><label class="addfile" for="quick" onclick="quickId='${c.id}'">＋ إضافة ملف</label></div></article>`}).join(''):'<div class="empty">لا توجد مقررات</div>';let a=courses.flatMap(c=>c.items||[]),d=a.filter(x=>st(x)==='done').length;$('ct').textContent=courses.length;$('ft').textContent=a.length;$('pt').textContent=(a.length?Math.round(d/a.length*100):0)+'%';save()}function openCourse(id){current=courses.find(c=>c.id===id);$('dname').textContent=(current.icon||'📘')+' '+current.name;$('dmeta').textContent=(current.code||'بدون رمز')+' · '+(current.credits||0)+' وحدات';renderFiles();showScreen('detailScreen')}function renderFiles(){$('files').innerHTML=current.items.length?current.items.map((x,i)=>`<div class="file"><div>📄</div><div class="fileInfo"><b>${esc(x.fileName||x.name)}</b><div class="small">${esc(x.fileType||'ملف')}</div></div><button onclick="openEditor('${esc(x.fileId||'')}','${encodeURIComponent(x.fileName||x.name)}')">✏️ فتح وتحرير</button><select onchange="setStatus(${i},this.value)"><option value="incomplete" ${st(x)==='incomplete'?'selected':''}>⏱ لم يكتمل</option><option value="done" ${st(x)==='done'?'selected':''}>✅ تم الإنجاز</option><option value="review" ${st(x)==='review'?'selected':''}>🕘 مراجعة</option></select><button class="del" onclick="deleteFile(${i})">🗑 حذف</button></div>`).join(''):'<div class="empty">لا توجد ملفات بعد.</div>';save()}function setStatus(i,s){current.items[i].status=s;current.items[i].done=s==='done';save();renderFiles()}async function deleteFile(i){let x=current.items[i];if(!confirm('حذف الملف؟'))return;if(x.fileId)await dbDelete(x.fileId);current.items.splice(i,1);save();renderFiles()}function openModal(c){editing=c;$('modalTitle').textContent=c?'تخصيص المقرر':'إضافة مقرر';$('mn').value=c?c.name:'';$('mc').value=c?c.code||'':'';$('mu').value=c?c.credits||0:3;$('mi').value=c?c.icon||'':'';$('deleteCourse').style.display=c?'block':'none';$('courseModal').classList.add('on')}function closeModal(){$('courseModal').classList.remove('on')}function editCourse(id){openModal(courses.find(c=>c.id===id))}$('addCourse').onclick=()=>openModal(null);$('modalSave').onclick=()=>{let n=$('mn').value.trim();if(!n)return;if(editing){editing.name=n;editing.code=$('mc').value;editing.credits=+$('mu').value;editing.icon=$('mi').value}else courses.push({id:Date.now()+'',name:n,code:$('mc').value,credits:+$('mu').value,icon:$('mi').value,items:[]});save();closeModal();render()};$('deleteCourse').onclick=()=>{if(editing&&confirm('حذف المقرر؟')){courses=courses.filter(c=>c.id!==editing.id);save();closeModal();render()}};$('search').oninput=render;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});$('picker').onchange=async e=>{await addFiles(current,e.target.files);e.target.value=''};$('quick').onchange=async e=>{let c=courses.find(x=>x.id===quickId);if(c)await addFiles(c,e.target.files);e.target.value='';render()};async function addFiles(c,fs){for(const f of fs){let id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2);await dbPut(id,f);c.items.push({name:f.name,fileName:f.name,fileType:f.type,fileSize:f.size,fileId:id,status:'incomplete'})}save();if(current===c)renderFiles()}function db(){return new Promise((ok,no)=>{let r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(id,blob){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').put({id,blob,name:blob.name,type:blob.type});t.oncomplete=ok})}async function dbGet(id){let d=await db();return new Promise(ok=>{let r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}async function dbDelete(id){let d=await db();return new Promise(ok=>{let t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=ok})}let editId=null,editName='',tool='pen',color='#111111',lineWidth=4,hiOpacity=.35,eraser=24,drawing=false,last=null,undoStack=[],mediaRecorder,chunks=[],objectUrl=null;const canvas=$('ink'),ctx=canvas.getContext('2d');async function openEditor(id,name){if(!id)return alert('أعد إضافة هذا الملف من جهازك مرة واحدة.');editId=id;editName=decodeURIComponent(name);$('editorTitle').textContent=editName+' · NoviStudy';$('editorScreen').classList.add('on');document.body.style.overflow='hidden';await showFile();setTimeout(resizeCanvas,150)}function closeEditor(){saveInk();$('editorScreen').classList.remove('on');document.body.style.overflow='';$('pdfView').hidden=$('imgView').hidden=$('textView').hidden=true;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}renderFiles()}async function showFile(){let rec=await dbGet(editId);if(!rec)return alert('لم يتم العثور على الملف على هذا الجهاز.');objectUrl=URL.createObjectURL(rec.blob);let type=rec.type||rec.blob.type||'';$('pdfView').hidden=$('imgView').hidden=$('textView').hidden=true;if(type.includes('pdf')){$('pdfView').hidden=false;$('pdfView').src=objectUrl}else if(type.startsWith('image/')){$('imgView').hidden=false;$('imgView').src=objectUrl}else if(type.startsWith('text/')){$('textView').hidden=false;$('textView').textContent=await rec.blob.text()}else{$('pdfView').hidden=false;$('pdfView').src=objectUrl}setTimeout(loadInk,300)}function resizeCanvas(){let r=$('editPage').getBoundingClientRect(),old=canvas.width?canvas.toDataURL():null,ratio=devicePixelRatio||1;canvas.width=r.width*ratio;canvas.height=r.height*ratio;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(ratio,0,0,ratio,0,0);if(old){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}window.addEventListener('resize',()=>{if($('editorScreen').classList.contains('on'))resizeCanvas()});document.querySelectorAll('[data-dtool]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dtool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tool=b.dataset.dtool;if(tool==='highlighter')color='#ffd92f'});document.querySelectorAll('[data-col]').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('.color').forEach(y=>y.classList.remove('on'));x.classList.add('on');color=x.dataset.col;tool=x.parentElement.id==='hiColors'?'highlighter':'pen';document.querySelectorAll('[data-dtool]').forEach(y=>y.classList.toggle('on',y.dataset.dtool===tool))});$('customBtn').onclick=()=>$('customPanel').classList.toggle('on');$('widthRange').oninput=e=>{lineWidth=+e.target.value;$('wv').textContent=lineWidth};$('opacityRange').oninput=e=>{hiOpacity=+e.target.value/100;$('ov').textContent=e.target.value};$('eraserRange').oninput=e=>{eraser=+e.target.value;$('ev').textContent=eraser};function pointerPos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{e.preventDefault();undoStack.push(canvas.toDataURL());if(undoStack.length>25)undoStack.shift();drawing=true;last=pointerPos(e);canvas.setPointerCapture?.(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();let p=pointerPos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=eraser}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='highlighter'?hiOpacity:(tool==='pencil'?.65:1);ctx.lineWidth=tool==='pencil'?Math.max(1,lineWidth*.65):lineWidth}ctx.stroke();ctx.globalAlpha=1;last=p};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;saveInk()};function undoInk(){let s=undoStack.pop();if(!s)return;ctx.clearRect(0,0,canvas.width,canvas.height);let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);im.src=s;saveInk()}function clearInk(){if(!confirm('مسح جميع الكتابة؟'))return;undoStack.push(canvas.toDataURL());ctx.clearRect(0,0,canvas.width,canvas.height);saveInk()}function saveInk(){if(!editId)return;try{localStorage.setItem('novi_ink_'+editId,canvas.toDataURL())}catch(e){}}function loadInk(){ctx.clearRect(0,0,canvas.width,canvas.height);let s=localStorage.getItem('novi_ink_'+editId);if(s){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);im.src=s}}$('recordBtn').onclick=async()=>{if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();$('recordBtn').classList.remove('live');$('recordBtn').innerHTML='<span>🎙️</span>تسجيل';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(chunks,{type:mediaRecorder.mimeType}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='NoviStudy-'+editName+'-'+Date.now()+'.webm';a.click();stream.getTracks().forEach(t=>t.stop());setTimeout(()=>URL.revokeObjectURL(u),5000)};mediaRecorder.start();$('recordBtn').classList.add('live');$('recordBtn').innerHTML='<span>⏹️</span>إيقاف'}catch(e){alert('اسمح للموقع باستخدام الميكروفون لتسجيل الصوت.')}};render();</script></body></html>
