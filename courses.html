<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NoviStudy | المقررات</title><link rel="stylesheet" href="novistudy-v2.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{padding:26px;max-width:1300px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.add{border:0;background:#087df2;color:#fff;border-radius:14px;padding:13px 18px;font-weight:900}.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.folder{background:#fff;border:1px solid #dfe8f0;border-radius:22px;padding:22px;cursor:pointer}.folder .ico{font-size:38px}.folder h3{margin:10px 0 4px}.empty{text-align:center;color:#7890a5;padding:60px}.modal{display:none;position:fixed;inset:0;background:#00182e88;z-index:700;place-items:center}.modal.on{display:grid}.box{width:min(520px,92vw);background:#fff;border-radius:24px;padding:24px}.box input{width:100%;padding:12px;border:1px solid #dce5ed;border-radius:12px;margin:8px 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{padding:18px;border:1px solid #dce5ed;border-radius:16px;background:#f7faff;font-weight:800}.items{margin-top:20px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #e0e8ee;border-radius:17px;padding:15px;margin:10px 0}.item select{padding:8px;border-radius:10px}.btn{border:0;border-radius:12px;padding:10px 14px}.primary{background:#087df2;color:#fff}.danger{background:#fff0f1;color:#c8444e}.back{cursor:pointer;color:#087df2}.hidden{display:none!important}@media(max-width:850px){.folders{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section id="root"><div class="head"><div><h1>المقررات الدراسية</h1><p>أنشئ مجلدًا لكل مقرر.</p></div><button class="add" id="addCourse">＋ إضافة مجلد</button></div><div id="folders" class="folders"></div></section><section id="inside" class="hidden"><div class="head"><div><div class="back" id="back">← المقررات</div><h1 id="courseName"></h1></div><button class="add" id="plus">＋</button></div><div id="items" class="items"></div></section></main><div class="modal" id="nameModal"><div class="box"><h2 id="nameTitle">إضافة مجلد</h2><input id="nameInput" placeholder="الاسم"><button class="btn primary" id="nameSave">حفظ</button><button class="btn" onclick="nameModal.classList.remove('on')">إلغاء</button></div></div><div class="modal" id="choiceModal"><div class="box"><h2>ماذا تريد أن تضيف؟</h2><div class="choice"><button id="addChapter">📄 إضافة شابتر</button><button id="addSubfolder">📁 إضافة مجلد</button></div></div></div><input id="filePicker" type="file" multiple accept=".pdf,.ppt,.pptx,image/*" hidden><script src="novistudy-v2.js"></script><script>const KEY='novi_courses',$=x=>document.getElementById(x);let data=[],current=null,pending='course';try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};function save(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){folders.innerHTML=data.length?data.map((c,i)=>`<div class="folder" onclick="openCourse(${i})"><div class="ico">📁</div><h3>${c.name}</h3><small>${(c.items||[]).length} عنصر</small></div>`).join(''):'<div class="empty">لا توجد مقررات بعد. اضغط ＋ إضافة مجلد.</div>'}window.openCourse=i=>{current=i;root.classList.add('hidden');inside.classList.remove('hidden');courseName.textContent=data[i].name;renderItems()};function renderItems(){let c=data[current];c.items=c.items||[];items.innerHTML=c.items.length?c.items.map((x,i)=>`<div class="item"><div><b>${x.kind==='folder'?'📁':x.kind==='chapter'?'📄':'📎'} ${x.name||x.fileName}</b><small style="display:block;color:#789">${x.kind==='file'?(x.type||'ملف'):x.kind==='chapter'?'شابتر':'مجلد'}</small></div><div>${x.kind==='file'?`<select onchange="status(${i},this.value)"><option value="incomplete" ${x.status==='incomplete'?'selected':''}>لم يكتمل</option><option value="review" ${x.status==='review'?'selected':''}>يحتاج مراجعة</option><option value="done" ${x.status==='done'?'selected':''}>مكتمل</option></select>`:''}<button class="btn" onclick="renameItem(${i})">إعادة تسمية</button><button class="btn danger" onclick="delItem(${i})">حذف</button>${x.kind==='folder'?`<button class="btn primary" onclick="pickForFolder(${i})">＋ إضافة ملف</button>`:''}</div></div>`).join(''):'<div class="empty">اضغط ＋ لإضافة شابتر أو مجلد.</div>'}window.status=(i,v)=>{data[current].items[i].status=v;save()};window.delItem=i=>{if(confirm('حذف هذا العنصر؟')){data[current].items.splice(i,1);save();renderItems()}};window.renameItem=i=>{let x=data[current].items[i],n=prompt('الاسم الجديد',x.name||x.fileName);if(n){if(x.kind==='file')x.fileName=n;else x.name=n;save();renderItems()}};let targetFolder=null;window.pickForFolder=i=>{targetFolder=i;filePicker.click()};filePicker.onchange=()=>{let c=data[current];[...filePicker.files].forEach(f=>c.items.push({kind:'file',fileName:f.name,type:f.type||f.name.split('.').pop(),status:'incomplete',folderIndex:targetFolder}));save();renderItems();filePicker.value=''};addCourse.onclick=()=>{pending='course';nameTitle.textContent='إضافة مجلد مقرر';nameInput.value='';nameModal.classList.add('on')};plus.onclick=()=>choiceModal.classList.add('on');addChapter.onclick=()=>{choiceModal.classList.remove('on');pending='chapter';nameTitle.textContent='إضافة شابتر';nameInput.value='';nameModal.classList.add('on')};addSubfolder.onclick=()=>{choiceModal.classList.remove('on');pending='folder';nameTitle.textContent='إضافة مجلد';nameInput.value='';nameModal.classList.add('on')};nameSave.onclick=()=>{let n=nameInput.value.trim();if(!n)return;if(pending==='course')data.push({name:n,items:[]});else data[current].items.push({kind:pending,name:n,status:pending==='chapter'?'incomplete':undefined});save();nameModal.classList.remove('on');pending==='course'?render():renderItems()};back.onclick=()=>{inside.classList.add('hidden');root.classList.remove('hidden');render()};render();</script></body></html>
