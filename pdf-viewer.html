<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#eef2f6;overflow:auto}#pages{width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0}.page{display:block;width:100%;height:auto;background:#fff;box-shadow:0 1px 8px #0002}#loading{position:fixed;inset:0;display:grid;place-items:center;font:700 18px -apple-system,BlinkMacSystemFont,sans-serif;color:#31506a;background:#fff;z-index:5}</style></head><body><div id="loading">جاري فتح الملف…</div><div id="pages"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const id=new URLSearchParams(location.search).get('id');function db(){return new Promise((ok,no)=>{const r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getFile(){const d=await db();return new Promise(ok=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}async function render(){const rec=await getFile();if(!rec)throw Error('file missing');const data=await rec.blob.arrayBuffer();const pdf=await pdfjsLib.getDocument({data}).promise;const host=document.getElementById('pages');host.innerHTML='';for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const base=page.getViewport({scale:1});const cssWidth=document.documentElement.clientWidth;const dpr=Math.min(devicePixelRatio||1,2);const scale=(cssWidth/base.width)*dpr;const vp=page.getViewport({scale});const c=document.createElement('canvas');c.className='page';c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=cssWidth+'px';c.style.height=(vp.height/dpr)+'px';host.appendChild(c);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}document.getElementById('loading').style.display='none'}render().catch(e=>{document.getElementById('loading').textContent='تعذر عرض ملف PDF';console.error(e)});</script></body></html>
