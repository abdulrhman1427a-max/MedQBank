<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=4,user-scalable=yes"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#e9edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:auto;-webkit-overflow-scrolling:touch}#pages{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:78px 12px 38px}.sheet{position:relative;background:#fff;box-shadow:0 3px 16px #1c304522;border-radius:4px;overflow:hidden}.page{display:block;width:100%;height:auto;background:#fff}.pageNo{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);background:#1a2735cc;color:#fff;border-radius:20px;padding:4px 10px;font-size:11px;direction:ltr;opacity:.72}#loading{position:fixed;inset:0;display:grid;place-items:center;font:700 17px -apple-system,BlinkMacSystemFont,sans-serif;color:#31506a;background:#f5f7f9;z-index:5}.topfade{position:fixed;z-index:3;top:0;left:0;right:0;height:56px;background:linear-gradient(#e9edf2 10%,transparent);pointer-events:none}@media(max-width:800px){#pages{padding:70px 8px 28px;gap:12px}.sheet{box-shadow:0 2px 11px #26354420}}</style></head><body><div class="topfade"></div><div id="loading">جاري تجهيز الملف…</div><div id="pages"></div><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const id=new URLSearchParams(location.search).get('id');function polishParent(){try{const d=parent.document;if(!d||d.getElementById('noviEditorPolish'))return;const s=d.createElement('style');s.id='noviEditorPolish';s.textContent=`#editorScreen{background:#e9edf2!important}.floatingTop{top:max(10px,env(safe-area-inset-top))!important;height:54px!important;padding:5px 8px!important;gap:4px!important;border-radius:16px!important;background:rgba(28,36,47,.92)!important;box-shadow:0 8px 24px #0003!important}.ftool{width:40px!important;height:40px!important;font-size:19px!important;border-radius:10px!important}.ftool.on{background:#1677b8!important;box-shadow:none!important}.divider{height:28px!important}.dot{width:19px!important;height:19px!important}.sizeBox input{width:64px!important}.edgeBtn{top:max(12px,env(safe-area-inset-top))!important;height:48px!important;border-radius:14px!important;padding:0 15px!important;background:rgba(28,36,47,.92)!important}.saveBtn{background:#1677b8!important}.hint{display:none!important}.pageBadge{display:none!important}.pop{top:74px!important;border-radius:16px!important}.editorDoc{background:#e9edf2!important}@media(max-width:850px){.floatingTop{top:max(10px,env(safe-area-inset-top))!important;bottom:auto!important;max-width:calc(100vw - 250px)!important;height:52px!important}.ftool{min-width:38px!important;width:38px!important;height:38px!important}.pop{top:70px!important;bottom:auto!important}}`;d.head.appendChild(s);const back=d.querySelector('.backBtn'),save=d.querySelector('.saveBtn');if(back)back.textContent='‹ رجوع';if(save)save.textContent='حفظ';}catch(e){}}polishParent();const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});async function getFile(){const d=await idb();return new Promise(ok=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}async function render(){const rec=await getFile();if(!rec)throw Error('file missing');const data=await rec.blob.arrayBuffer(),pdf=await pdfjsLib.getDocument({data}).promise,host=document.getElementById('pages');host.innerHTML='';const viewportWidth=document.documentElement.clientWidth,maxWidth=Math.min(viewportWidth-24,1180);for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),base=page.getViewport({scale:1}),cssWidth=Math.min(maxWidth,Math.max(base.width,viewportWidth*.82)),dpr=Math.min(devicePixelRatio||1,2),scale=(cssWidth/base.width)*dpr,vp=page.getViewport({scale}),sheet=document.createElement('div'),c=document.createElement('canvas'),num=document.createElement('span');sheet.className='sheet';sheet.style.width=cssWidth+'px';sheet.style.height=(vp.height/dpr)+'px';c.className='page';c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=cssWidth+'px';c.style.height=(vp.height/dpr)+'px';num.className='pageNo';num.textContent=n+' / '+pdf.numPages;sheet.append(c,num);host.appendChild(sheet);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}document.getElementById('loading').style.display='none';parent.postMessage({type:'noviPdfReady',pages:pdf.numPages},'*')}render().catch(e=>{document.getElementById('loading').textContent='تعذر عرض ملف PDF';console.error(e)});</script></body></html>
