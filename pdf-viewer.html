<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=4,user-scalable=yes"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#dfe4e9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:auto;-webkit-overflow-scrolling:touch}#pages{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:22px;padding:86px 22px 70px}.sheet{position:relative;background:#fff;box-shadow:0 5px 24px #26354426;border-radius:3px;overflow:hidden}.page{display:block;width:100%;height:auto;background:#fff}.pageNo{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#1c2732c9;color:#fff;border-radius:20px;padding:4px 10px;font-size:11px;opacity:.65}#loading{position:fixed;inset:0;display:grid;place-items:center;font:700 17px -apple-system,BlinkMacSystemFont,sans-serif;color:#31506a;background:#f5f7f9;z-index:5}.topfade{position:fixed;z-index:3;top:0;left:0;right:0;height:64px;background:linear-gradient(#dfe4e9 25%,transparent);pointer-events:none}@media(max-width:800px){#pages{padding:76px 10px 60px;gap:14px}.sheet{box-shadow:0 3px 14px #26354424}}</style></head><body><div class="topfade"></div><div id="loading">جاري تجهيز الملف…</div><div id="pages"></div><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const id=new URLSearchParams(location.search).get('id');function db(){return new Promise((ok,no)=>{const r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getFile(){const d=await db();return new Promise(ok=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}async function render(){const rec=await getFile();if(!rec)throw Error('file missing');const data=await rec.blob.arrayBuffer();const pdf=await pdfjsLib.getDocument({data}).promise;const host=document.getElementById('pages');host.innerHTML='';const maxWidth=Math.min(document.documentElement.clientWidth-44,1050);for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),base=page.getViewport({scale:1}),cssWidth=Math.min(maxWidth,base.width*1.45),dpr=Math.min(devicePixelRatio||1,2),scale=(cssWidth/base.width)*dpr,vp=page.getViewport({scale}),sheet=document.createElement('div'),c=document.createElement('canvas'),num=document.createElement('span');sheet.className='sheet';sheet.style.width=cssWidth+'px';sheet.style.height=(vp.height/dpr)+'px';c.className='page';c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=cssWidth+'px';c.style.height=(vp.height/dpr)+'px';num.className='pageNo';num.textContent=n+' / '+pdf.numPages;sheet.append(c,num);host.appendChild(sheet);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}document.getElementById('loading').style.display='none';parent.postMessage({type:'noviPdfReady',pages:pdf.numPages},'*')}render().catch(e=>{document.getElementById('loading').textContent='تعذر عرض ملف PDF';console.error(e)});</script></body></html>
