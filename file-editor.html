<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>محرر الملف | NoviStudy</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#123b5b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}.top{height:66px;background:linear-gradient(90deg,#064568,#0b8dbc);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px}.top b{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top button{border:1px solid #ffffff55;background:#ffffff10;color:#fff;border-radius:12px;padding:10px 15px;font-weight:800}.workspace{height:calc(100vh - 66px);display:grid;grid-template-columns:1fr 92px}.stage{position:relative;overflow:auto;padding:24px;display:grid;place-items:start center}.page{position:relative;background:#fff;width:min(900px,100%);min-height:calc(100vh - 115px);box-shadow:0 8px 35px #173b5720;border-radius:8px;overflow:hidden}.preview{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#fff}.draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:4}.tools{background:#fff;border-right:1px solid #d9e4ec;display:flex;flex-direction:column;align-items:center;gap:9px;padding:13px 8px;overflow-y:auto}.tool{width:64px;min-height:58px;border:1px solid #d9e4ec;background:#fff;border-radius:15px;color:#173d5b;font-size:12px;font-weight:800;padding:6px 3px}.tool span{display:block;font-size:23px}.tool.on{background:#e8f5ff;border-color:#63bceb;color:#0879b3}.colors{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.color{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c8d5df}.color.on{box-shadow:0 0 0 3px #65b8e6}.panel{position:fixed;right:105px;top:82px;width:270px;background:#fff;border:1px solid #d8e3eb;border-radius:18px;padding:16px;box-shadow:0 12px 35px #173b5725;z-index:20;display:none}.panel.on{display:block}.panel label{display:block;font-weight:800;margin:9px 0 5px}.panel input[type=range]{width:100%}.rec{color:#c93e48}.rec.live{background:#fff0f1;border-color:#efbfc4;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.55}}.hint{position:fixed;bottom:18px;right:110px;background:#123c5be8;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:20}@media(max-width:700px){.workspace{grid-template-columns:1fr 74px}.tools{padding:8px 4px}.tool{width:58px}.stage{padding:10px}.panel{right:82px}.hint{right:82px}}</style></head><body><header class="top"><button onclick="history.back()">← رجوع</button><b id="title">NoviStudy · محرر الملف</b><button onclick="undo()">↶ تراجع</button><button onclick="clearInk()">مسح الكتابة</button></header><main class="workspace"><section class="stage"><div class="page" id="page"><iframe id="pdf" class="preview" hidden></iframe><img id="img" class="preview" hidden><div id="text" class="preview" hidden style="padding:28px;white-space:pre-wrap;overflow:auto"></div><canvas id="canvas" class="draw"></canvas></div></section><aside class="tools"><button class="tool on" data-tool="pen"><span>✒️</span>قلم</button><div class="colors" id="penColors"><i class="color on" data-c="#111111" style="background:#111"></i><i class="color" data-c="#1688e5" style="background:#1688e5"></i><i class="color" data-c="#e23f48" style="background:#e23f48"></i></div><button class="tool" data-tool="pencil"><span>✏️</span>رصاص</button><button class="tool" data-tool="highlighter"><span>🖍️</span>تظليل</button><div class="colors" id="hiColors"><i class="color" data-c="#ffd92f" style="background:#ffd92f"></i><i class="color" data-c="#ff5360" style="background:#ff5360"></i><i class="color" data-c="#a768e8" style="background:#a768e8"></i></div><button class="tool" data-tool="eraser"><span>🧽</span>ممحاة</button><button class="tool" id="custom"><span>⚙️</span>تخصيص</button><button class="tool rec" id="record"><span>🎙️</span>تسجيل</button></aside></main><div class="panel" id="panel"><b>تخصيص أداة الكتابة</b><label>السُمك: <span id="wv">4</span> px</label><input id="width" type="range" min="1" max="30" value="4"><label>شفافية التظليل: <span id="ov">35</span>%</label><input id="opacity" type="range" min="10" max="80" value="35"><label>حجم الممحاة: <span id="ev">24</span> px</label><input id="eraserSize" type="range" min="8" max="70" value="24"><button onclick="panel.classList.remove('on')" style="width:100%;margin-top:13px;height:40px;border:0;border-radius:10px;background:#074b70;color:#fff;font-weight:800">تم</button></div><div class="hint" id="hint">اكتب مباشرة بالقلم أو Apple Pencil فوق الملف</div><script>const q=new URLSearchParams(location.search),id=q.get('id'),name=q.get('name')||'الملف';title.textContent=name+' · NoviStudy';let tool='pen',color='#111111',width=4,opacity=.35,eraser=24,drawing=false,last=null,historyStack=[],mediaRecorder,chunks=[];const c=canvas,ctx=c.getContext('2d'),page=document.getElementById('page'),panel=document.getElementById('panel');function resize(){let r=page.getBoundingClientRect(),old=c.toDataURL();c.width=Math.max(1,r.width*devicePixelRatio);c.height=Math.max(1,r.height*devicePixelRatio);c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.scale(devicePixelRatio,devicePixelRatio);let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}new ResizeObserver(resize).observe(page);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tool=b.dataset.tool;if(tool==='highlighter'&&!['#ffd92f','#ff5360','#a768e8'].includes(color))color='#ffd92f'});document.querySelectorAll('.color').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('.color').forEach(y=>y.classList.remove('on'));x.classList.add('on');color=x.dataset.c;if(x.parentElement.id==='hiColors'){tool='highlighter';document.querySelectorAll('[data-tool]').forEach(y=>y.classList.toggle('on',y.dataset.tool==='highlighter'))}else{tool='pen';document.querySelectorAll('[data-tool]').forEach(y=>y.classList.toggle('on',y.dataset.tool==='pen'))}});custom.onclick=()=>panel.classList.toggle('on');document.getElementById('width').oninput=e=>{width=+e.target.value;wv.textContent=width};document.getElementById('opacity').oninput=e=>{opacity=+e.target.value/100;ov.textContent=e.target.value};eraserSize.oninput=e=>{eraser=+e.target.value;ev.textContent=eraser};function pos(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function start(e){e.preventDefault();historyStack.push(c.toDataURL());if(historyStack.length>25)historyStack.shift();drawing=true;last=pos(e)}function move(e){if(!drawing)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=eraser}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='highlighter'?opacity:(tool==='pencil'?.65:1);ctx.lineWidth=tool==='pencil'?Math.max(1,width*.65):width}ctx.stroke();ctx.globalAlpha=1;last=p}function end(){drawing=false;saveInk()}c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);function undo(){let x=historyStack.pop();if(!x)return;ctx.clearRect(0,0,c.width,c.height);let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=x;saveInk()}function clearInk(){if(!confirm('مسح جميع الكتابة على هذا الملف؟'))return;historyStack.push(c.toDataURL());ctx.clearRect(0,0,c.width,c.height);saveInk()}function saveInk(){try{localStorage.setItem('novi_ink_'+id,c.toDataURL())}catch(e){}}function loadInk(){let s=localStorage.getItem('novi_ink_'+id);if(s){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=s}}async function DB(){return new Promise((ok,no)=>{let r=indexedDB.open('NoviStudyFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getFile(){let d=await DB();return new Promise(ok=>{let r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}async function showFile(){let rec=await getFile();if(!rec)return hint.textContent='لم يتم العثور على الملف على هذا الجهاز';let u=URL.createObjectURL(rec.blob),type=rec.type||rec.blob.type||'';if(type.includes('pdf')){pdf.hidden=false;pdf.src=u}else if(type.startsWith('image/')){img.hidden=false;img.src=u}else if(type.startsWith('text/')){text.hidden=false;text.textContent=await rec.blob.text()}else{pdf.hidden=false;pdf.src=u}setTimeout(loadInk,350)}record.onclick=async()=>{if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();record.classList.remove('live');record.innerHTML='<span>🎙️</span>تسجيل';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(chunks,{type:mediaRecorder.mimeType}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='NoviStudy-'+name+'-'+Date.now()+'.webm';a.click();stream.getTracks().forEach(t=>t.stop());hint.textContent='تم حفظ التسجيل الصوتي'};mediaRecorder.start();record.classList.add('live');record.innerHTML='<span>⏹️</span>إيقاف'}catch(e){alert('اسمح للمتصفح باستخدام الميكروفون لتسجيل الصوت.')}};showFile();</script></body></html>
